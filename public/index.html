<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프랜차이즈 상권 지도</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

    <!-- 상단 헤더 -->
    <header class="bg-blue-600 text-white shadow-md p-4 text-center font-bold text-xl">
        🏪 역삼1동 프랜차이즈 상권 지도 및 목록
    </header>

    <!-- 메인 컨테이너 -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 flex flex-col md:flex-row gap-4">
        
        <!-- 좌측: 지도 영역 -->
        <div class="w-full md:w-1/2 bg-white rounded-lg shadow p-4 flex flex-col">
            <h2 class="text-lg font-semibold mb-2 text-gray-700">📍 지도 보기</h2>
            <div id="map" class="w-full h-96 bg-gray-200 rounded-md flex items-center justify-center text-gray-500 text-sm p-4 text-center">
                지도를 불러오는 중입니다...
            </div>
        </div>

        <!-- 우측: 상점 목록 영역 -->
        <div class="w-full md:w-1/2 bg-white rounded-lg shadow p-4 flex flex-col">
            <h2 class="text-lg font-semibold mb-2 text-gray-700">📋 상점 목록 (데이터)</h2>
            <div id="store-list" class="w-full h-96 overflow-y-auto border border-gray-200 rounded-md p-2 space-y-2">
                <p class="text-gray-400 text-center mt-32">데이터를 불러오는 중입니다...</p>
            </div>
        </div>

    </main>

    <!-- 카카오 지도 API 스크립트 로드 실패 시 전역 함수 -->
    <script>
        function handleKakaoError() {
            console.warn('⚠️ 카카오 지도 스크립트 로드가 차단되었습니다.');
            const mapDiv = document.getElementById('map');
            mapDiv.innerHTML = '<span class="text-red-500">네트워크 환경에 의해 카카오 지도가 차단되었습니다.<br>(상점 목록 데이터는 정상 조회됩니다)</span>';
        }
    </script>
    <!-- 카카오 지도 SDK (autoload=false 적용) -->
    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=4d5aaedcde7f98e5717fef7eb4e1652d&libraries=clusterer,services&autoload=false" onerror="handleKakaoError()"></script>

    <!-- 핵심 비즈니스 로직 -->
    <script>
        let map = null;

        // 1. 백엔드 서버에서 상점 데이터 가져오기
        async function fetchStoreData() {
            const listContainer = document.getElementById('store-list');
            
            try {
                const response = await fetch('/api/franchises');
                const data = await response.json();

                console.log('서버 응답 데이터:', data);

                // 공공데이터 응답 구조에 맞게 items 추출
                const items = data?.body?.items || data?.response?.body?.items || [];

                if (!items || items.length === 0) {
                    listContainer.innerHTML = '<p class="text-gray-500 text-center mt-32">조회된 상점 데이터가 없습니다.</p>';
                    return;
                }

                // 목록 화면에 뿌려주기
                renderStoreList(items);

                // 지도가 정상 로드되어 있다면 마커 찍기 시도
                if (typeof kakao !== 'undefined' && kakao.maps && kakao.maps.load) {
                    kakao.maps.load(() => {
                        initMapAndMarkers(items);
                    });
                }

            } catch (error) {
                console.error('데이터 조회 실패:', error);
                listContainer.innerHTML = '<p class="text-red-500 text-center mt-32">데이터를 불러오는 중 오류가 발생했습니다.</p>';
            }
        }

        // 2. 우측 상점 목록 HTML 렌더링
        function renderStoreList(items) {
            const listContainer = document.getElementById('store-list');
            listContainer.innerHTML = ''; // 초기화

            items.forEach(store => {
                const card = document.createElement('div');
                card.className = 'p-3 bg-gray-50 hover:bg-blue-50 border border-gray-200 rounded-md transition';
                card.innerHTML = `
                    <div class="font-bold text-blue-600">${store.bizesNm || '상호명 없음'}</div>
                    <div class="text-xs text-gray-500">${store.indsSclsNm || '업종 정보 없음'}</div>
                    <div class="text-sm text-gray-700 mt-1">📍 ${store.rdnmAdr || store.lnoAdr || '주소 정보 없음'}</div>
                `;
                listContainer.appendChild(card);
            });
        }

        // 3. 지도 초기화 및 마커 표시
        function initMapAndMarkers(items) {
            const mapContainer = document.getElementById('map');
            
            let centerLat = 37.500655;
            let centerLng = 127.036431;

            const firstWithCoords = items.find(s => s.lat && s.lon);
            if (firstWithCoords) {
                centerLat = parseFloat(firstWithCoords.lat);
                centerLng = parseFloat(firstWithCoords.lon);
            }

            const options = {
                center: new kakao.maps.LatLng(centerLat, centerLng),
                level: 3
            };

            map = new kakao.maps.Map(mapContainer, options);

            items.forEach(store => {
                if (store.lat && store.lon) {
                    const markerPosition = new kakao.maps.LatLng(parseFloat(store.lat), parseFloat(store.lon));
                    const marker = new kakao.maps.Marker({
                        position: markerPosition
                    });
                    marker.setMap(map);
                }
            });
        }

        // 페이지 로드 시 데이터 요청 실행
        window.onload = function() {
            fetchStoreData();
        };
    </script>
</body>
</html>
