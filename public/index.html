<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>뭐 먹지? 근처 맛집 찾기 (Google Places)</title>
    <!-- 구글 맵 SDK (places 라이브러리 포함) -->
    <script type="text/javascript" src="https://maps.googleapis.com/maps/api/js?key=__GOOGLE_API_KEY__&libraries=places&language=ko"></script>
    <style>
        body { margin: 0; padding: 0; font-family: 'Malgun Gothic', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        #map { flex: 2; height: 100%; position: relative; }
        #sidebar { flex: 1; height: 100%; background: #f8f9fa; border-left: 1px solid #ddd; display: flex; flex-direction: column; }
        
        .sidebar-header { padding: 15px 20px; background: #ea4335; color: white; font-size: 18px; font-weight: bold; display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; }
        
        .header-btn-wrap { display: flex; gap: 6px; }
        .global-toggle-btn, .wishlist-tab-btn { background: rgba(255, 255, 255, 0.2); border: 1px solid rgba(255, 255, 255, 0.4); color: white; padding: 4px 8px; font-size: 12px; border-radius: 4px; cursor: pointer; font-weight: normal; }
        .global-toggle-btn:hover, .wishlist-tab-btn:hover { background: rgba(255, 255, 255, 0.3); }
        .wishlist-tab-btn.active { background: white; color: #ea4335; font-weight: bold; border-color: white; }

        .mobile-handle-bar { display: none; width: 100%; height: 28px; background: #f8f9fa; align-items: center; justify-content: center; cursor: pointer; border-top: 1px solid #ddd; border-radius: 14px 14px 0 0; user-select: none; }
        .mobile-handle { width: 48px; height: 5px; background: #94a3b8; border-radius: 3px; }

        .search-control-container { padding: 12px 15px; background: #ffffff; border-bottom: 1px solid #e2e8f0; display: flex; flex-direction: column; gap: 8px; }
        .search-row { display: flex; gap: 8px; align-items: center; }
        .search-input { flex: 1; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; }
        .search-input:focus { border-color: #ea4335; }
        
        .search-btn { padding: 8px 14px; background: #ea4335; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .search-btn:hover { background: #d33828; }

        .geolocation-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 5;
            background: white;
            border: 1px solid #cbd5e1;
            padding: 8px 14px;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            font-weight: bold;
            font-size: 13px;
            color: #333;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            outline: none;
            transition: 0.2s;
        }
        .geolocation-btn:hover {
            background: #f1f5f9;
            color: #ea4335;
            border-color: #ea4335;
        }

        .store-list { flex: 1; overflow-y: auto; padding: 15px; }
        
        .group-section { margin-bottom: 20px; }
        .group-title { font-size: 15px; font-weight: bold; color: #333; margin-bottom: 10px; padding-bottom: 5px; border-bottom: 2px solid #ea4335; display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
        .group-title:hover { color: #ea4335; }
        .group-count-wrap { display: flex; align-items: center; gap: 8px; }
        .group-count { background: #ea4335; color: white; font-size: 11px; padding: 2px 6px; border-radius: 10px; }
        .toggle-icon { font-size: 12px; color: #666; transition: transform 0.2s; }
        
        .group-content { display: flex; flex-direction: column; gap: 8px; transition: all 0.3s ease; }
        .group-content.collapsed { display: none; }

        .store-card { background: white; padding: 12px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); cursor: pointer; transition: 0.2s; border-left: 4px solid #ea4335; position: relative; }
        .store-card:hover { background: #f1f5f9; transform: translateY(-2px); }
        .store-card.selected { background: #fce8e6; border-left-color: #c5221f; }
        
        .store-name { font-size: 15px; font-weight: bold; color: #111; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
        .store-info { font-size: 12px; color: #555; margin-bottom: 2px; }
        .store-category { font-size: 11px; color: #ea4335; font-weight: bold; margin-top: 4px; }
        
        /* 🌟 명확하게 눈에 띄는 평점 배지 스타일 */
        .rating-badge {
            background: #feefc3;
            color: #b06000;
            border: 1px solid #f9ab00;
            font-size: 12px;
            font-weight: 800;
            padding: 2px 7px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            margin-left: 6px;
            vertical-align: middle;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .wish-btn {
            background: transparent;
            border: none;
            font-size: 16px;
            cursor: pointer;
            padding: 2px 4px;
            transition: transform 0.1s;
        }
        .wish-btn:active { transform: scale(1.25); }

        .guide-text { padding: 8px 15px; background: #fce8e6; color: #c5221f; font-size: 12px; border-bottom: 1px solid #fad2cf; line-height: 1.4; }

        @media (max-width: 768px) {
            body { flex-direction: column; height: 100vh; position: relative; }
            #map { width: 100%; height: 100%; flex: none; position: absolute; top: 0; left: 0; z-index: 1; }
            .geolocation-btn { top: 15px; right: 15px; padding: 6px 10px; font-size: 12px; }
            #sidebar { 
                position: absolute; bottom: 0; left: 0; width: 100%; height: 32vh; z-index: 10; 
                border-left: none; border-top: 1px solid #ddd; box-shadow: 0 -4px 15px rgba(0,0,0,0.15);
                border-radius: 18px 18px 0 0; transition: height 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
            }
            #sidebar.list-expanded { height: 88vh; }
            #sidebar.map-expanded { height: 12vh; }
            .mobile-handle-bar { display: flex; }
        }
    </style>
</head>
<body>

    <div id="map">
        <button id="current-location-btn" class="geolocation-btn">
            📍 내 위치로 이동
        </button>
    </div>

    <div id="sidebar">
        <div class="mobile-handle-bar" id="drag-handle">
            <div class="mobile-handle"></div>
        </div>

        <div class="sidebar-header" id="sidebar-header-toggle">
            <span>🗺️ Google 근처 맛집 찾기</span>
            <div class="header-btn-wrap" onclick="event.stopPropagation();">
                <button id="wishlist-tab-btn" class="wishlist-tab-btn">❤️ 찜 (0)</button>
                <button id="global-toggle-btn" class="global-toggle-btn">모두 접기</button>
            </div>
        </div>
        <div class="guide-text" id="guide-text-msg">💡 지도를 클릭하거나 위치를 이동하여 중심점을 지정하세요.</div>
        
        <div class="search-control-container">
            <div class="search-row">
                <input type="text" id="search-keyword" class="search-input" placeholder="음식점 이름 또는 업종 검색">
                <button id="search-btn" class="search-btn">찾기</button>
            </div>
        </div>

        <div class="store-list" id="store-list-container">
            <p id="status-msg" style="text-align: center; color: #888; margin-top: 50px;">현재 위치를 확인하는 중...</p>
        </div>
    </div>

    <script>
        let map, centerMarker, centerCircle, geocoder, placesService;
        let centerLat = 37.566535;
        let centerLng = 126.977969;
        let currentLevel = 15; // 구글 맵 zoom 레벨 (숫자가 클수록 확대)
        let radius = 2000; // 반경 2km
        
        let currentMarkers = [];
        let pinnedInfoWindow = null;
        let currentStores = [];
        let isAllCollapsed = false;
        let isWishlistMode = false;
        let wishlist = JSON.parse(localStorage.getItem('google_store_wishlist') || '[]');

        function initMap() {
            const statusMsg = document.getElementById('status-msg');
            statusMsg.innerHTML = '구글 지도를 초기화하는 중...';

            const mapOptions = {
                center: { lat: centerLat, lng: centerLng },
                zoom: 16,
                mapTypeControl: false,
                streetViewControl: false
            };

            map = new google.maps.Map(document.getElementById('map'), mapOptions);
            geocoder = new google.maps.Geocoder();
            placesService = new google.maps.places.PlacesService(map);

            updateWishlistButtonCount();

            // 지도 클릭 시 중심점 이동 및 음식점 검색
            map.addListener('click', function(mapsMouseEvent) {
                const clickedLatLng = mapsMouseEvent.latLng;
                centerLat = clickedLatLng.lat();
                centerLng = clickedLatLng.lng();

                if (isWishlistMode) {
                    isWishlistMode = false;
                    updateWishlistButtonCount();
                }

                updateCenterMarker(clickedLatLng);
                loadGooglePlaces(centerLat, centerLng);
            });

            // 줌 변경 시 반경 조정
            map.addListener('zoom_changed', function() {
                const zoom = map.getZoom();
                // 줌 레벨에 따라 반경 동적 조절 가능 (기본 반경 2km 유지)
                loadGooglePlaces(centerLat, centerLng);
            });

            // 현재 위치 가져오기
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        centerLat = position.coords.latitude;
                        centerLng = position.coords.longitude;
                        const pos = { lat: centerLat, lng: centerLng };
                        map.setCenter(pos);
                        updateCenterMarker(pos);
                        loadGooglePlaces(centerLat, centerLng);
                    },
                    function() {
                        const pos = { lat: centerLat, lng: centerLng };
                        updateCenterMarker(pos);
                        loadGooglePlaces(centerLat, centerLng);
                    }
                );
            } else {
                const pos = { lat: centerLat, lng: centerLng };
                updateCenterMarker(pos);
                loadGooglePlaces(centerLat, centerLng);
            }

            document.getElementById('current-location-btn').onclick = function(e) {
                e.stopPropagation();
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(function(position) {
                        centerLat = position.coords.latitude;
                        centerLng = position.coords.longitude;
                        const pos = { lat: centerLat, lng: centerLng };
                        map.setCenter(pos);
                        updateCenterMarker(pos);
                        loadGooglePlaces(centerLat, centerLng);
                    });
                }
            };

            document.getElementById('search-btn').onclick = filterStores;
            document.getElementById('search-keyword').onkeyup = function(e) {
                if (e.key === 'Enter') filterStores();
            };

            setupSidebarEvents();
        }

        function updateCenterMarker(latLng) {
            if (centerMarker) centerMarker.setMap(null);
            if (centerCircle) centerCircle.setMap(null);

            centerMarker = new google.maps.Marker({
                position: latLng,
                map: map,
                icon: {
                    url: 'https://maps.google.com/mapfiles/ms/icons/red-dot.png'
                }
            });

            centerCircle = new google.maps.Circle({
                strokeColor: '#ea4335',
                strokeOpacity: 0.8,
                strokeWeight: 2,
                fillColor: '#ea4335',
                fillOpacity: 0.15,
                map: map,
                center: latLng,
                radius: radius
            });

            updateGuideText(radius, null);

            geocoder.geocode({ location: latLng }, function(results, status) {
                if (status === 'OK' && results[0]) {
                    const addressName = results[0].formatted_address;
                    updateGuideText(radius, addressName);
                }
            });
        }

        function updateGuideText(r, addressName) {
            const guideEl = document.getElementById('guide-text-msg');
            let rangeStr = r >= 1000 ? `${(r / 1000).toFixed(1)}km` : `${r}m`;
            
            if (isWishlistMode) {
                guideEl.innerHTML = `❤️ <strong>찜한 음식점 목록</strong>을 조회 중입니다. (${wishlist.length}개)`;
                return;
            }

            if (addressName) {
                guideEl.innerHTML = `📍 <strong>중심 위치:</strong> ${addressName}<br>📍 반경 <strong>${rangeStr}</strong> 내 🍽️ 음식점`;
            } else {
                guideEl.innerHTML = `📍 현재 위치 기준 반경 <strong>${rangeStr}</strong> 내 🍽️ 음식점을 불러옵니다.`;
            }
        }

        function loadGooglePlaces(lat, lng) {
            if (isWishlistMode) return;

            const request = {
                location: new google.maps.LatLng(lat, lng),
                radius: radius,
                type: 'restaurant'
            };

            document.getElementById('store-list-container').innerHTML = '<p style="text-align: center; color: #888; margin-top: 50px;">구글 맵 데이터를 불러오는 중...</p>';

            placesService.nearbySearch(request, function(results, status) {
                if (status === google.maps.places.PlacesServiceStatus.OK && results) {
                    currentStores = results;
                    renderStores(currentStores);
                } else {
                    currentStores = [];
                    renderStores([]);
                }
            });
        }

        function renderStores(stores) {
            const listContainer = document.getElementById('store-list-container');
            listContainer.innerHTML = '';
            clearMarkers();

            if (!stores || stores.length === 0) {
                listContainer.innerHTML = '<p style="text-align: center; color: #888; margin-top: 30px;">검색 결과가 없습니다.</p>';
                return;
            }

            const groups = {};

            stores.forEach(store => {
                const groupKey = getCategoryGroup(store.types);
                if (!groups[groupKey]) groups[groupKey] = [];
                groups[groupKey].push(store);

                const name = store.name;
                const address = store.vicinity || '주소 정보 없음';
                const rating = store.rating ? store.rating.toFixed(1) : '정보없음';
                const reviewCount = store.user_ratings_total || 0;
                const placeId = store.place_id;
                const latLng = store.geometry.location;

                // 거리 계산
                const distanceMeters = google.maps.geometry.spherical.computeDistanceBetween(
                    new google.maps.LatLng(centerLat, centerLng),
                    latLng
                );
                store.distanceMeters = Math.round(distanceMeters);

                const marker = new google.maps.Marker({
                    position: latLng,
                    map: map,
                    title: name
                });

                const googleMapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name)}&query_place_id=${placeId}`;
                const isW = isWished(placeId);
                const ratingBadgeHtml = rating !== '정보없음' 
                    ? `<span class="rating-badge">⭐ ${rating} (${reviewCount})</span>` 
                    : `<span style="font-size:11px; color:#888; margin-left:4px;">평점 없음</span>`;

                const infowindowContent = `
                    <div style="padding:10px; font-size:12px; width:220px; line-height:1.4;">
                        <a href="${googleMapUrl}" target="_blank" style="font-weight:bold; font-size:14px; color:#ea4335; text-decoration:none;">
                            ${name} 🔗
                        </a><br>
                        ${ratingBadgeHtml}<br>
                        <div><strong>주소:</strong> ${address}</div>
                        <div><strong>중심지에서:</strong> 약 ${store.distanceMeters}m</div>
                    </div>
                `;

                const infowindow = new google.maps.InfoWindow({ content: infowindowContent });

                marker.addListener('click', function() {
                    if (pinnedInfoWindow) pinnedInfoWindow.close();
                    infowindow.open(map, marker);
                    pinnedInfoWindow = infowindow;
                });

                currentMarkers.push({ marker, infowindow, store });
            });

            // UI 그룹 렌더링
            let totalCount = 0;
            for (const [groupName, storeList] of Object.entries(groups)) {
                totalCount += storeList.length;
                const section = document.createElement('div');
                section.className = 'group-section';

                const titleDiv = document.createElement('div');
                titleDiv.className = 'group-title';
                titleDiv.innerHTML = `
                    <span>🍽️ ${groupName}</span>
                    <div class="group-count-wrap">
                        <span class="group-count">${storeList.length}개</span>
                        <span class="toggle-icon">▼</span>
                    </div>
                `;

                const contentDiv = document.createElement('div');
                contentDiv.className = 'group-content';

                titleDiv.onclick = function() {
                    const isCollapsed = contentDiv.classList.toggle('collapsed');
                    titleDiv.querySelector('.toggle-icon').style.transform = isCollapsed ? 'rotate(-90deg)' : 'rotate(0deg)';
                };

                section.appendChild(titleDiv);
                section.appendChild(contentDiv);

                storeList.sort((a, b) => (b.rating || 0) - (a.rating || 0));

                storeList.forEach(store => {
                    const name = store.name;
                    const address = store.vicinity || '주소 정보 없음';
                    const rating = store.rating ? store.rating.toFixed(1) : '정보없음';
                    const reviewCount = store.user_ratings_total || 0;
                    const placeId = store.place_id;
                    const googleMapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name)}&query_place_id=${placeId}`;
                    const isW = isWished(placeId);
                    
                    const ratingBadgeHtml = rating !== '정보없음' 
                        ? `<span class="rating-badge">⭐ ${rating} (${reviewCount})</span>` 
                        : `<span style="font-size:11px; color:#888;">평점 없음</span>`;

                    const card = document.createElement('div');
                    card.className = 'store-card';
                    
                    card.innerHTML = `
                        <div class="store-name">
                            <span>${name} ${ratingBadgeHtml}</span>
                            <div style="display:flex; align-items:center; gap:6px;">
                                <button class="wish-btn">${isW ? '❤️' : '🤍'}</button>
                                <a href="${googleMapUrl}" target="_blank" onclick="event.stopPropagation();" style="font-size:11px; color:#ea4335; text-decoration:none;">[구글지도 ↗]</a>
                            </div>
                        </div>
                        <div class="store-info">📍 ${address}</div>
                        <div class="store-info">📏 중심지에서 약 ${store.distanceMeters}m</div>
                    `;

                    card.querySelector('.wish-btn').onclick = function(e) {
                        e.stopPropagation();
                        toggleWish(store);
                    };

                    card.onclick = function() {
                        const found = currentMarkers.find(m => m.store === store);
                        if (found) {
                            if (pinnedInfoWindow) pinnedInfoWindow.close();
                            found.infowindow.open(map, found.marker);
                            pinnedInfoWindow = found.infowindow;
                            map.setCenter(found.marker.getPosition());
                        }
                    };

                    contentDiv.appendChild(card);
                });

                listContainer.appendChild(section);
            }
        }

        function getCategoryGroup(types) {
            if (!types) return '기타 음식점';
            if (types.includes('cafe')) return '카페/디저트';
            if (types.includes('bar') || types.includes('night_club')) return '술집/바';
            if (types.includes('bakery')) return '베이커리/제과';
            if (types.includes('meal_takeaway') || types.includes('fast_food')) return '패스트푸드/분식';
            return '일반 음식점';
        }

        function clearMarkers() {
            currentMarkers.forEach(item => item.marker.setMap(null));
            currentMarkers = [];
            if (pinnedInfoWindow) pinnedInfoWindow.close();
        }

        function toggleWish(store) {
            const placeId = store.place_id;
            const index = wishlist.indexOf(placeId);
            if (index > -1) {
                wishlist.splice(index, 1);
            } else {
                wishlist.push(placeId);
                localStorage.setItem(`store_data_${placeId}`, JSON.stringify(store)); // 데이터 임시 저장
            }
            localStorage.setItem('google_store_wishlist', JSON.stringify(wishlist));
            updateWishlistButtonCount();
            
            if (isWishlistMode) renderWishlist();
            else renderStores(currentStores);
        }

        function isWished(placeId) {
            return wishlist.includes(placeId);
        }

        function updateWishlistButtonCount() {
            const btn = document.getElementById('wishlist-tab-btn');
            btn.innerText = `❤️ 찜 (${wishlist.length})`;
            if (isWishlistMode) btn.classList.add('active');
            else btn.classList.remove('active');
        }

        function renderWishlist() {
            isWishlistMode = true;
            updateWishlistButtonCount();
            updateGuideText(radius, null);

            const listContainer = document.getElementById('store-list-container');
            listContainer.innerHTML = '';
            clearMarkers();

            if (wishlist.length === 0) {
                listContainer.innerHTML = '<p style="text-align: center; color: #888; margin-top: 50px;">찜한 음식점이 없습니다.</p>';
                return;
            }

            const contentDiv = document.createElement('div');
            contentDiv.className = 'group-content';

            wishlist.forEach(placeId => {
                const storeDataStr = localStorage.getItem(`store_data_${placeId}`);
                if (!storeDataStr) return;
                const store = JSON.parse(storeDataStr);

                const name = store.name;
                const address = store.vicinity || '주소 정보 없음';
                const rating = store.rating ? store.rating.toFixed(1) : '정보없음';
                const reviewCount = store.user_ratings_total || 0;
                const googleMapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name)}&query_place_id=${placeId}`;
                const ratingBadgeHtml = rating !== '정보없음' ? `<span class="rating-badge">⭐ ${rating} (${reviewCount})</span>` : '';

                const card = document.createElement('div');
                card.className = 'store-card';
                card.innerHTML = `
                    <div class="store-name">
                        <span>${name} ${ratingBadgeHtml}</span>
                        <button class="wish-btn">❤️</button>
                    </div>
                    <div class="store-info">📍 ${address}</div>
                `;

                card.querySelector('.wish-btn').onclick = function(e) {
                    e.stopPropagation();
                    toggleWish(store);
                };

                contentDiv.appendChild(card);
            });

            const section = document.createElement('div');
            section.className = 'group-section';
            section.innerHTML = `<div class="group-title" style="cursor:default;"><span>❤️ 찜한 맛집 모음</span></div>`;
            section.appendChild(contentDiv);
            listContainer.appendChild(section);
        }

        function filterStores() {
            const keyword = document.getElementById('search-keyword').value.trim().toLowerCase();
            if (!keyword) {
                renderStores(currentStores);
                return;
            }
            const filtered = currentStores.filter(store => store.name.toLowerCase().includes(keyword));
            renderStores(filtered);
        }

        function setupSidebarEvents() {
            const sidebar = document.getElementById('sidebar');
            const dragHandle = document.getElementById('drag-handle');
            const sidebarHeader = document.getElementById('sidebar-header-toggle');

            function toggleExpand() {
                if (window.innerWidth <= 768) {
                    sidebar.classList.toggle('list-expanded');
                }
            }

            dragHandle.onclick = toggleExpand;
            sidebarHeader.onclick = toggleExpand;

            document.getElementById('wishlist-tab-btn').onclick = function(e) {
                e.stopPropagation();
                isWishlistMode = !isWishlistMode;
                if (isWishlistMode) renderWishlist();
                else loadGooglePlaces(centerLat, centerLng);
            };

            document.getElementById('global-toggle-btn').onclick = function() {
                isAllCollapsed = !isAllCollapsed;
                document.querySelectorAll('.group-content').forEach(el => {
                    if (isAllCollapsed) el.classList.add('collapsed');
                    else el.classList.remove('collapsed');
                });
                this.innerText = isAllCollapsed ? '모두 펼치기' : '모두 접기';
            };
        }
    </script>
</body>
</html>
