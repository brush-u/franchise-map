                    const sLon = parseFloat(store.lon || store.lng || store.x);
                    const { rating, reviewCount } = getStoreRatingAndReviews(store);

                    if (!isNaN(sLat) && !isNaN(sLon)) {
                        const pos = { lat: sLat, lng: sLon };
                        const marker = new google.maps.Marker({ position: pos, map: mapClusterer ? null : map });
                        marker.addListener('click', () => createCustomPopup(store, pos));
                        currentMarkers.push({ marker, store });
                        newMarkers.push(marker);
                    }

                    const card = document.createElement('div');
                    card.className = 'store-card';
                    store._cardElement = card;
                    card.innerHTML = `
                        <div class="store-name">
                            <span><a href="${getMapSearchUrl(name, address)}" target="_blank" onclick="event.stopPropagation();">${name}</a> <span class="rating-badge">⭐ ${rating} (${reviewCount})</span></span>
                            <button class="wish-btn">❤️</button>
                        </div>
                        <div class="store-info">📍 ${address}</div>
                        <div class="store-info">☎️ ${store.telno || generateMockTel(store.bizesId, address)}</div>
                        <div class="store-category">🏷️ ${store.indsSclsNm || '즐겨찾기 맛집'}</div>
                    `;
                    card.querySelector('.wish-btn').onclick = (e) => toggleWish(store, e);
                    card.onclick = (e) => {
                        e.stopPropagation();
                        if (!isNaN(sLat) && !isNaN(sLon)) { map.panTo({ lat: sLat, lng: sLon }); createCustomPopup(store, { lat: sLat, lng: sLon }); }
                    };
                    contentDiv.appendChild(card);
                });
                if (mapClusterer && newMarkers.length > 0) {
                    mapClusterer.addMarkers(newMarkers);
                }

                const section = document.createElement('div');
                section.className = 'group-section';
                section.innerHTML = `<div class="group-title" style="cursor:default;"><span>❤️ 찜한 맛집 모음</span><span class="group-count">${wishlist.length}개</span></div>`;
                section.appendChild(contentDiv);
                listContainer.appendChild(section);
            }

            let storesLoadInProgress = false;
            let pendingStoresLoad = null;
            let storesLoadToken = 0; // 이 값이 바뀌면 이전 백그라운드 로딩은 중단(무시)한다

            const MAX_TOTAL_FETCH = 3000; // 체감 속도를 위한 상한 (그 이상은 반경을 줄이도록 안내)
            const BG_PAGE_DELAY_MS = 250;
            const PREVIEW_SIZE = 30; // "미리보기" 요청 건수 — 작을수록 응답이 빠르다

            function showGuideMessage(html) {
                const guideEl = document.getElementById('guide-text-msg');
                if (guideEl) guideEl.innerHTML = html;
            }

            function showLoadingSpinner() {
                const listContainer = document.getElementById('store-list-container');
                if (listContainer) {
                    listContainer.innerHTML = `
                        <div style="text-align:center; padding:40px 0; color:#64748b;">
                            <div class="spinner" style="width:32px; height:32px; border:3px solid #e2e8f0; border-top-color:#2563eb; border-radius:50%; margin:0 auto 12px; animation:spin 0.7s linear infinite;"></div>
                            <div style="font-size:15px;">불러오는 중...</div>
                        </div>
                        <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
                    `;
                }
            }

            async function fetchStorePage(lat, lng, pageNo, useFilterParam, numOfRows) {
                const qs = new URLSearchParams({ cx: lng, cy: lat, radius, pageNo, useFilter: useFilterParam });
                if (numOfRows) qs.set('numOfRows', numOfRows);
                const response = await fetch(`/api/stores/radius?${qs.toString()}`);
                const data = await response.json();
                if (!response.ok || data.success === false) {
                    const detail = data.apiHeader
                        ? `resultCode: ${data.apiHeader.resultCode} / ${data.apiHeader.resultMsg}`
                        : (data.error || data.message || '알 수 없는 오류');
                    const err = new Error(detail);
                    err.isApiError = true;
                    err.detail = detail;
                    throw err;
                }
                return data;
            }

            function mergeAndRenderStores(rawItems) {
                window.__lastRawItems = rawItems;
                window.__debugFindStore = function (nameKeyword) {
                    const found = rawItems.filter(it => (it.bizesNm || '').replace(/\s/g, '').includes(nameKeyword.replace(/\s/g, '')));
                    if (found.length === 0) {
                        console.log(`[진단] "${nameKeyword}"를 포함한 업소가 지금까지 불러온 데이터에 없습니다.`);
                    } else {
                        found.forEach(it => {
                            const cat = getFoodCategory(it.indsSclsNm, it.indsLclsNm, it.bizesNm, it.indsMclsNm);
                            console.log(`[진단] "${it.bizesNm}" 원본:`, it, `\n→ 필터 결과: ${cat === null ? '❌ 제외됨' : '✅ 포함됨 (' + cat + ')'}`);
                        });
                    }
                    return found;
                };
                currentStores = rawItems.filter(s => getFoodCategory(s.indsSclsNm, s.indsLclsNm, s.bizesNm, s.indsMclsNm) !== null);
                console.log(`[진단] 원본 ${rawItems.length}건 중 음식점으로 분류된 건수: ${currentStores.length}건`);
                if (rawItems.length > 0 && currentStores.length === 0) {
                    console.warn('⚠️ 원본 데이터는 있는데 음식점으로 분류된 게 0건입니다. 첫 번째 원본 항목 필드를 확인하세요:', rawItems[0]);
                }
                filterStores();
                // 분석 화면이 이제 기본(메인) 화면이라, 데이터가 갱신될 때마다(미리보기 -> 1페이지 -> 백그라운드) 항상 같이 새로고침한다.
                renderTradeAreaAnalysis();
            }

            // 화면이 오래 하얗게 비어있지 않도록, 먼저 아주 작은 "미리보기"(30건)를 빠르게 받아서
            // 즉시 뭐라도 보여준다. 그다음 정식 페이지네이션(500건 단위)으로 전체를 채운다.
            // 건수가 적을수록 공공데이터 서버의 응답 자체도 더 빨리 오는 경향이 있다.
            async function loadStores(lat, lng) {
                if (isWishlistMode) return;
                if (storesLoadInProgress) {
                    pendingStoresLoad = { lat, lng };
                    return;
                }
                storesLoadInProgress = true;
                const myToken = ++storesLoadToken;

                const searchKeywordEl = document.getElementById('search-keyword');
                if (searchKeywordEl) searchKeywordEl.value = '';

                showLoadingSpinner();
                showGuideMessage('🔄 불러오는 중...');

                // 위도/경도는 참고 정보일 뿐이고, 실제 주소를 역지오코딩해서 분석 화면 상단에 표시한다.
                currentAddressStr = '주소 확인 중...';
                renderTradeAreaAnalysis();
                geocoder.geocode({ location: { lat, lng } }, (results, status) => {
                    if (myToken !== storesLoadToken) return; // 그 사이 다른 위치로 이동했으면 무시
                    currentAddressStr = (status === 'OK' && results[0]) ? results[0].formatted_address : '주소를 확인할 수 없습니다';
                    renderTradeAreaAnalysis();
                });

                try {
                    // 0단계: 미리보기 (작은 건수라 빠르게 옴). 실패해도 조용히 넘어가고 본 조회로 진행한다.
                    let usedFilterHint = 'auto';
                    try {
                        const preview = await fetchStorePage(lat, lng, 1, 'auto', PREVIEW_SIZE);
                        if (myToken !== storesLoadToken) return;
                        const previewItems = preview.body.items || [];
                        usedFilterHint = preview.body.usedFilter ? '1' : '0';
                        if (previewItems.length > 0) {
                            console.log(`[진단] 미리보기 도착: ${previewItems.length}건 (즉시 표시)`);
                            mergeAndRenderStores(previewItems);
                            showGuideMessage('🔄 나머지 불러오는 중...');
                        }
                    } catch (err) {
                        console.warn('⚠️ 미리보기 실패, 본 조회로 바로 진행:', err.detail || err.message);
                    }
                    if (myToken !== storesLoadToken) return;

                    // 1단계: 정식 1페이지 (미리보기에서 필터 적용 여부를 확인했으면 그대로 재사용해서
                    // 서버가 다시 판단하지 않아도 되게 한다 = 한 템포 더 빠름)
                    let firstPage;
                    try {
                        firstPage = await fetchStorePage(lat, lng, 1, usedFilterHint);
                    } catch (err) {
                        console.error('❌ [상점 조회 실패]', err.detail || err.message);
                        showGuideMessage(`⚠️ 데이터를 불러오지 못했습니다: ${err.detail || err.message}`);
                        currentStores = [];
                        renderStores(currentStores);
                        return;
                    }
                    if (myToken !== storesLoadToken) return;

                    let allItems = firstPage.body.items || [];
                    const totalCount = firstPage.body.totalCount || allItems.length;
                    const usedFilter = firstPage.body.usedFilter;
                    let hasMore = firstPage.body.hasMore;
                    window.__lastFetchTruncated = false;

                    console.log(`[진단] 1페이지 도착: ${allItems.length}건 (전체 ${totalCount}건, 서버 업종필터: ${usedFilter ? '적용됨' : '미적용'})`);

                    mergeAndRenderStores(allItems);

                    if (hasMore && totalCount > allItems.length) {
                        showGuideMessage(`🔄 더 불러오는 중... (${allItems.length}/${Math.min(totalCount, MAX_TOTAL_FETCH)}건)`);
                    }

                    // 나머지 페이지는 뒤에서 계속 이어받는다. 그 사이 사용자가 다른 곳을 클릭/줌하면
                    // storesLoadToken이 바뀌어서 이 루프는 스스로 멈춘다 (낡은 응답이 화면을 덮어쓰지 않게).
                    let pageNo = 1;
                    const filterFlag = usedFilter ? '1' : '0';
                    while (hasMore && allItems.length < MAX_TOTAL_FETCH) {
                        if (myToken !== storesLoadToken) return; // 더 최신 요청이 시작됐으면 중단
                        await new Promise((r) => setTimeout(r, BG_PAGE_DELAY_MS));
                        pageNo++;
                        let nextPage;
                        try {
                            nextPage = await fetchStorePage(lat, lng, pageNo, filterFlag);
                        } catch (err) {
                            console.warn('⚠️ 백그라운드 페이지 로딩 중단:', err.detail || err.message);
                            break;
                        }
                        if (myToken !== storesLoadToken) return;

                        allItems = allItems.concat(nextPage.body.items || []);
                        hasMore = nextPage.body.hasMore;
                        mergeAndRenderStores(allItems);
                        showGuideMessage(hasMore && allItems.length < MAX_TOTAL_FETCH
                            ? `🔄 더 불러오는 중... (${allItems.length}/${Math.min(totalCount, MAX_TOTAL_FETCH)}건)`
                            : `📍 현재 위치 기준 반경 <strong>${rangeStrFromRadius(radius)}</strong> 내 음식점 ${allItems.length}건`);
                    }

                    if (allItems.length >= MAX_TOTAL_FETCH && totalCount > allItems.length) {
                        window.__lastFetchTruncated = true;
                        showGuideMessage(`⚠️ 업소가 너무 많아 ${MAX_TOTAL_FETCH}건까지만 표시했습니다 (전체 ${totalCount}건). 반경을 줄이면 더 정확합니다.`);
                    }
                } catch (error) {
                    console.error('데이터 로드 실패:', error);
                } finally {
                    if (myToken === storesLoadToken) storesLoadInProgress = false;
                    if (pendingStoresLoad) {
                        const next = pendingStoresLoad;
                        pendingStoresLoad = null;
                        loadStores(next.lat, next.lng);
                    }
                }
            }

            function rangeStrFromRadius(r) {
                return r >= 1000 ? (r / 1000) + 'km' : r + 'm';
            }

            function isFranchiseStore(s) {
                return (s.brchNm || '').trim() !== '';
            }

            function filterStores() {
                if (isWishlistMode) return;
                const kw = (document.getElementById('search-keyword')?.value || '').replace(/\s+/g, '').toLowerCase();
                const franchiseOnly = document.getElementById('franchise-only-check')?.checked;

                let filtered = currentStores;
                if (franchiseOnly) filtered = filtered.filter(isFranchiseStore);
                if (kw) {
                    filtered = filtered.filter(s => (s.bizesNm || '').replace(/\s+/g, '').toLowerCase().includes(kw) || (s.indsSclsNm || '').replace(/\s+/g, '').toLowerCase().includes(kw));
                }
                renderStores(filtered);
            }

            document.getElementById('search-btn').onclick = filterStores;
            document.getElementById('search-keyword').onkeyup = (e) => (e.key === 'Enter') && filterStores();
            document.getElementById('franchise-only-check').onchange = filterStores;
            document.getElementById('map-platform-select').onchange = () => isWishlistMode ? renderWishlist() : filterStores();

            function updateCenterMarker(latLngObj) {
                if (centerMarker) centerMarker.setMap(null);
                if (centerCircle) centerCircle.setMap(null);

                centerMarker = new google.maps.Marker({ position: latLngObj, map: map, icon: { url: 'https://maps.google.com/mapfiles/ms/icons/red-dot.png' } });
                centerCircle = new google.maps.Circle({ strokeColor: '#2563eb', strokeOpacity: 0.8, strokeWeight: 2, fillColor: '#2563eb', fillOpacity: 0.1, map: map, center: latLngObj, radius: radius });

                updateGuideText(radius, null);
                geocoder.geocode({ location: latLngObj }, (results, status) => {
                    if (status === 'OK' && results[0]) {
                        currentAddressStr = results[0].formatted_address || '주소 정보 없음';
                        updateGuideText(radius, currentAddressStr);
                    }
                });
            }

            document.getElementById('current-location-btn').onclick = (e) => {
                e.stopPropagation();
                if (!navigator.geolocation) { alert('위치 정보 미지원'); return; }
                if (isWishlistMode) { isWishlistMode = false; updateWishlistButtonCount(); }

                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        currentLat = pos.coords.latitude;
                        currentLng = pos.coords.longitude;
                        const posObj = { lat: currentLat, lng: currentLng };
                        map.setCenter(posObj);
                        updateCenterMarker(posObj);
                        loadStores(currentLat, currentLng);
                    },
                    () => alert('현재 위치를 가져오지 못했습니다.'),
                    { enableHighAccuracy: true, timeout: 5000, maximumAge: 60000 }
                );
            };

            let zoomChangeTimer = null;
            map.addListener('zoom_changed', () => {
                const newZoom = map.getZoom();
                if (newZoom !== currentZoom) {
                    currentZoom = newZoom;
                    radius = getRadiusByZoom(currentZoom);

                    // 클러스터 숫자를 클릭했을 때만 검색 중심을 지도의 새 중심으로 옮긴다.
                    // 마우스 휠/핀치로 직접 줌인·아웃할 때는 구글맵이 커서 위치 쪽으로 살짝 이동시키는데,
                    // 여기서 좌표를 매번 다시 맞추면 "처음 찍은 위치가 계속 움직이는" 것처럼 보이게 된다.
                    // 그래서 이 경우엔 currentLat/currentLng를 그대로 고정해서 처음 찍은 위치가 유지되게 한다.
                    if (clusterZoomPending) {
                        const center = map.getCenter();
                        if (center) {
                            currentLat = center.lat();
                            currentLng = center.lng();
                        }
                    }

                    updateCenterMarker({ lat: currentLat, lng: currentLng });
                    // 줌을 빠르게 여러 번 바꿔도 요청은 마지막 한 번만 나가도록 디바운스
                    // (공공데이터 API의 초당 요청 제한에 걸리지 않기 위함)
                    clearTimeout(zoomChangeTimer);
                    zoomChangeTimer = setTimeout(() => loadStores(currentLat, currentLng), 400);
                }
            });

            map.addListener('click', (e) => {
                if (window.innerWidth <= 768) {
                    sidebar.style.transition = 'transform 0.3s cubic-bezier(0.25, 1, 0.5, 1)';
                    sidebar.style.transform = `translateY(${visibleVhToTranslateY(peekLevelsVh[0])})`;
                    currentHeightIndex = 0;
                    if (sizeToggleArrowBtn) sizeToggleArrowBtn.textContent = '▲';
                }
                if (activePopupOverlay) { activePopupOverlay.setMap(null); activePopupOverlay = null; }
                document.querySelectorAll('.store-card').forEach(c => c.classList.remove('selected'));

                currentLat = e.latLng.lat();
                currentLng = e.latLng.lng();
                if (isWishlistMode) { isWishlistMode = false; updateWishlistButtonCount(); }

                const posObj = { lat: currentLat, lng: currentLng };
                updateCenterMarker(posObj);
                loadStores(currentLat, currentLng);


            });

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        currentLat = pos.coords.latitude;
                        currentLng = pos.coords.longitude;
                        const posObj = { lat: currentLat, lng: currentLng };
                        map.setCenter(posObj);
                        updateCenterMarker(posObj);
                        loadStores(currentLat, currentLng);
                    },
                    () => {
                        const defaultObj = { lat: currentLat, lng: currentLng };
                        updateCenterMarker(defaultObj);
                        loadStores(currentLat, currentLng);
                    },
                    { enableHighAccuracy: true, timeout: 5000, maximumAge: 60000 }
                );
            } else {
                updateCenterMarker({ lat: currentLat, lng: currentLng });
                loadStores(currentLat, currentLng);
            }
        }
    </script>
</body>
</html>
