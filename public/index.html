<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>뭐 먹지? 근처 맛집 찾기</title>
    <!-- 구글 맵 API 로드 -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDfrimvyT5Z_mB64ljqmURgJgqbqhi7t88&libraries=places"></script>
    <style>
        body { margin: 0; padding: 0; font-family: 'Malgun Gothic', sans-serif; display: flex; height: 100vh; overflow: hidden; background: #f1f5f9; }
        #map { flex: 2; height: 100%; position: relative; }
        
        #sidebar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40vh;
            max-height: 90vh;
            min-height: 10vh;
            background: #ffffff;
            border-top: 1px solid #e2e8f0;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            box-shadow: 0 -8px 30px rgba(0,0,0,0.12);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            transition: height 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }
        
        .sidebar-header {
            width: 100%;
            padding: 12px 20px 14px 20px;
            background: #2563eb;
            color: white;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            flex-shrink: 0;
            box-sizing: border-box;
        }

        .handle-indicator-wrap {
            width: 100%;
            background: #ffffff;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding-top: 8px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            flex-shrink: 0;
        }
        .mobile-handle { width: 48px; height: 5px; background: #cbd5e1; border-radius: 3px; }
        
        .header-btn-wrap { display: flex; gap: 6px; align-items: center; }
        .global-toggle-btn, .wishlist-tab-btn { background: rgba(255, 255, 255, 0.2); border: 1px solid rgba(255, 255, 255, 0.4); color: white; padding: 4px 10px; font-size: 12px; border-radius: 6px; cursor: pointer; font-weight: normal; transition: background 0.2s; }
        .global-toggle-btn:hover, .wishlist-tab-btn:hover { background: rgba(255, 255, 255, 0.35); }
        .wishlist-tab-btn.active { background: white; color: #2563eb; font-weight: bold; border-color: white; }

        .size-toggle-arrow-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .size-toggle-arrow-btn:hover { background: rgba(255, 255, 255, 0.4); }

        .search-control-container { padding: 12px 16px; background: #ffffff; border-bottom: 1px solid #f1f5f9; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
        .search-row { display: flex; gap: 6px; align-items: center; }
        .search-input { flex: 1; padding: 9px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; background: #f8fafc; }
        .search-input:focus { border-color: #2563eb; background: #fff; }
        
        .map-selector { padding: 9px 8px; font-size: 12px; border-radius: 8px; border: 1px solid #cbd5e1; background: #f8fafc; color: #334155; font-weight: bold; cursor: pointer; outline: none; width: 95px; }
        
        .search-btn { padding: 9px 14px; background: #2563eb; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .search-btn:hover { background: #1d4ed8; }

        /* [핵심] 내 위치 버튼 확실한 시인성 확보 및 상단 고정 */
        .geolocation-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 1000;
            background: #ffffff;
            border: 2px solid #2563eb;
            padding: 10px 18px;
            border-radius: 30px;
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.25);
            font-weight: bold;
            font-size: 14px;
            color: #2563eb;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            outline: none;
            transition: all 0.2s;
        }
        .geolocation-btn:hover {
            background: #2563eb;
            color: #ffffff;
            transform: translateY(-2px);
        }

        .store-list { flex: 1; overflow-y: auto; padding: 15px; background: #f8fafc; -webkit-overflow-scrolling: touch; }
        
        .group-section { margin-bottom: 20px; }
        .group-title { font-size: 15px; font-weight: bold; color: #1e293b; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 2px solid #2563eb; display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
        .group-title:hover { color: #2563eb; }
        .group-count-wrap { display: flex; align-items: center; gap: 8px; }
        .group-count { background: #2563eb; color: white; font-size: 11px; padding: 2px 7px; border-radius: 10px; font-weight: normal; }
        .toggle-icon { font-size: 12px; color: #64748b; transition: transform 0.2s; }
        
        .group-content { display: flex; flex-direction: column; gap: 8px; transition: all 0.3s ease; }
        .group-content.collapsed { display: none; }

        .store-card { background: white; padding: 12px 14px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); cursor: pointer; transition: 0.2s; border: 1px solid #e2e8f0; border-left: 4px solid #2563eb; position: relative; }
        .store-card:hover { background: #f8fafc; transform: translateY(-2px); border-color: #cbd5e1; border-left-color: #2563eb; }
        .store-card.selected { background: #eff6ff; border-color: #bfdbfe; border-left-color: #1d4ed8; }
        
        .store-name { font-size: 15px; font-weight: bold; color: #0f172a; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; }
        .store-name a { color: #2563eb; text-decoration: none; }
        .store-name a:hover { text-decoration: underline; }
        .store-info { font-size: 12px; color: #475569; margin-bottom: 3px; }
        .store-category { font-size: 11px; color: #2563eb; font-weight: bold; margin-top: 6px; background: #eff6ff; display: inline-block; padding: 2px 6px; border-radius: 4px; }
        
        .rating-badge {
            background: #fffbeb;
            color: #d97706;
            border: 1px solid #fef3c7;
            font-size: 11px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            margin-left: 6px;
            vertical-align: middle;
        }

        .wish-btn { background: transparent; border: none; font-size: 16px; cursor: pointer; padding: 2px 4px; transition: transform 0.1s; }
        .wish-btn:active { transform: scale(1.25); }

        .guide-text { padding: 10px 16px; background: #eff6ff; color: #1e40af; font-size: 12px; border-bottom: 1px solid #dbeafe; line-height: 1.4; flex-shrink: 0; }

        /* [핵심] 커스텀 풍선말(슬림하고 세련된 디자인) */
        .custom-popup-bubble {
            position: absolute;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            width: 240px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 12px;
            box-sizing: border-box;
            font-family: 'Malgun Gothic', sans-serif;
            border: 1px solid #e2e8f0;
            z-index: 2000;
        }
        .custom-popup-bubble::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -6px;
            border-width: 6px;
            border-style: solid;
            border-color: #ffffff transparent transparent transparent;
        }

        @media (min-width: 769px) {
            #sidebar {
                position: relative;
                width: auto;
                height: 100% !important;
                flex: 1;
                border-top: none;
                border-left: 1px solid #e2e8f0;
                border-radius: 0;
            }
            .sidebar-header { border-radius: 0; }
            .handle-indicator-wrap { display: none; }
        }
    </style>
</head>
<body>

    <div id="map">
        <!-- 내 위치 버튼 (지도 위 우측 상단 명확히 노출) -->
        <button id="current-location-btn" class="geolocation-btn">
            📍 내 위치 찾기
        </button>
    </div>

    <div id="sidebar">
        <div class="handle-indicator-wrap" id="drag-handle">
            <div class="mobile-handle"></div>
        </div>

        <div class="sidebar-header" id="sidebar-header-toggle">
            <span>🍽️ 뭐 먹지? 근처 맛집 찾기</span>
            <div class="header-btn-wrap" onclick="event.stopPropagation();">
                <button id="wishlist-tab-btn" class="wishlist-tab-btn">❤️ 찜 (0)</button>
                <button id="global-toggle-btn" class="global-toggle-btn">모두 접기</button>
                <button id="size-toggle-arrow-btn" class="size-toggle-arrow-btn" title="창 크기 변경">▲</button>
            </div>
        </div>
        <div class="guide-text" id="guide-text-msg">💡 지도를 클릭하거나 위치를 이동하여 중심점을 지정하세요.</div>
        
        <div class="search-control-container">
            <div class="search-row">
                <select id="map-platform-select" class="map-selector">
                    <option value="google" selected>구글맵</option>
                    <option value="naver">네이버맵</option>
                    <option value="kakao">카카오맵</option>
                </select>
                <input type="text" id="search-keyword" class="search-input" placeholder="음식점 이름 또는 업종 검색">
                <button id="search-btn" class="search-btn">찾기</button>
            </div>
        </div>

        <div class="store-list" id="store-list-container">
            <p id="status-msg" style="text-align: center; color: #888; margin-top: 50px;">현재 위치를 확인하는 중...</p>
        </div>
    </div>

    <script>
        function getMapSearchUrl(storeName, address) {
            const platform = document.getElementById('map-platform-select') ? document.getElementById('map-platform-select').value : 'google';
            const query = encodeURIComponent(`${address} ${storeName}`);
            
            if (platform === 'naver') {
                return `https://map.naver.com/v5/search/${query}`;
            } else if (platform === 'kakao') {
                return `https://map.kakao.com/?q=${query}`;
            } else {
                return `https://www.google.com/maps/search/?api=1&query=${query}`;
            }
        }

        window.onload = function() {
            const sidebar = document.getElementById('sidebar');
            const mapContainer = document.getElementById('map');
            const dragHandle = document.getElementById('drag-handle');
            const sidebarHeader = document.getElementById('sidebar-header-toggle');
            const sizeToggleArrowBtn = document.getElementById('size-toggle-arrow-btn');

            const heights = ['12vh', '40vh', '88vh'];
            let currentHeightIndex = 1;

            function toggleWindowSize() {
                if (window.innerWidth <= 768) {
                    currentHeightIndex = (currentHeightIndex + 1) % heights.length;
                    sidebar.style.height = heights[currentHeightIndex];
                    sizeToggleArrowBtn.textContent = (currentHeightIndex === 2) ? '▼' : '▲';
                }
            }

            if (dragHandle) dragHandle.onclick = toggleWindowSize;
            if (sidebarHeader) sidebarHeader.onclick = toggleWindowSize;
            if (sizeToggleArrowBtn) {
                sizeToggleArrowBtn.onclick = function(e) {
                    e.stopPropagation();
                    toggleWindowSize();
                };
            }

            let startY = 0;
            let startHeight = 0;
            let isDragging = false;

            function onDragStart(clientY) {
                if (window.innerWidth > 768) return;
                isDragging = true;
                startY = clientY;
                startHeight = sidebar.offsetHeight;
                sidebar.style.transition = 'none';
            }

            function onDragMove(clientY) {
                if (!isDragging) return;
                const deltaY = startY - clientY;
                const newHeight = startHeight + deltaY;
                const maxHeight = window.innerHeight * 0.92;
                const minHeight = window.innerHeight * 0.1;
                
                if (newHeight >= minHeight && newHeight <= maxHeight) {
                    sidebar.style.height = `${newHeight}px`;
                }
            }

            function onDragEnd() {
                if (!isDragging) return;
                isDragging = false;
                sidebar.style.transition = 'height 0.3s cubic-bezier(0.25, 1, 0.5, 1)';
            }

            dragHandle.addEventListener('mousedown', (e) => onDragStart(e.clientY));
            window.addEventListener('mousemove', (e) => onDragMove(e.clientY));
            window.addEventListener('mouseup', onDragEnd);

            dragHandle.addEventListener('touchstart', (e) => onDragStart(e.touches[0].clientY));
            window.addEventListener('touchmove', (e) => onDragMove(e.touches[0].clientY));
            window.addEventListener('touchend', onDragEnd);

            const statusMsg = document.getElementById('status-msg');

            if (typeof google === 'undefined' || !google.maps) {
                if (statusMsg) statusMsg.innerHTML = '<span style="color:red;">❌ 구글 지도 SDK 로드 실패</span>';
                return;
            }

            let centerLat = 37.566535;
            let centerLng = 126.977969;
            
            function getRadiusByZoom(zoom) {
                if (zoom >= 18) return 100;
                if (zoom === 17) return 300;
                if (zoom === 16) return 500;
                if (zoom === 15) return 1000;
                if (zoom === 14) return 2000;
                if (zoom === 13) return 4000;
                return 6000;
            }

            let currentZoom = 15;
            let radius = getRadiusByZoom(currentZoom);

            const map = new google.maps.Map(mapContainer, {
                center: { lat: centerLat, lng: centerLng },
                zoom: currentZoom,
                streetViewControl: false,
                mapTypeControl: false,
                fullscreenControl: false,
                zoomControlOptions: {
                    position: google.maps.ControlPosition.RIGHT_BOTTOM
                }
            });

            const geocoder = new google.maps.Geocoder();

            let centerMarker = null;
            let centerCircle = null;
            let currentMarkers = []; 
            let activePopupOverlay = null;
            let currentStores = []; 
            let isAllCollapsed = false;
            let isWishlistMode = false;
            
            let wishlist = JSON.parse(localStorage.getItem('my_store_wishlist') || '[]');

            function updateWishlistButtonCount() {
                const wishBtn = document.getElementById('wishlist-tab-btn');
                if (wishBtn) {
                    wishBtn.innerText = `❤️ 찜 (${wishlist.length})`;
                    if (isWishlistMode) {
                        wishBtn.classList.add('active');
                    } else {
                        wishBtn.classList.remove('active');
                    }
                }
            }
            updateWishlistButtonCount();

            function getStoreKey(store) {
                return store.bizesId || (store.bizesNm + '_' + (store.rdnmAdr || store.lnoAdr));
            }

            function isWished(store) {
                const key = getStoreKey(store);
                return wishlist.includes(key);
            }

            function toggleWish(store, event) {
                if (event) event.stopPropagation();
                const key = getStoreKey(store);
                const index = wishlist.indexOf(key);

                if (index > -1) {
                    wishlist.splice(index, 1);
                } else {
                    wishlist.push(key);
                }

                localStorage.setItem('my_store_wishlist', JSON.stringify(wishlist));
                updateWishlistButtonCount();

                if (isWishlistMode) {
                    renderWishlist();
                } else {
                    filterStores();
                }
            }

            const globalToggleBtn = document.getElementById('global-toggle-btn');
            if (globalToggleBtn) {
                globalToggleBtn.onclick = function() {
                    isAllCollapsed = !isAllCollapsed;
                    const contents = document.querySelectorAll('.group-content');
                    const icons = document.querySelectorAll('.group-title .toggle-icon');

                    contents.forEach((content, index) => {
                        if (isAllCollapsed) {
                            content.classList.add('collapsed');
                            if (icons[index]) icons[index].style.transform = 'rotate(-90deg)';
                        } else {
                            content.classList.remove('collapsed');
                            if (icons[index]) icons[index].style.transform = 'rotate(0deg)';
                        }
                    });

                    globalToggleBtn.innerText = isAllCollapsed ? '모두 펼치기' : '모두 접기';
                };
            }

            const wishlistTabBtn = document.getElementById('wishlist-tab-btn');
            if (wishlistTabBtn) {
                wishlistTabBtn.onclick = function(e) {
                    e.stopPropagation();
                    isWishlistMode = !isWishlistMode;
                    updateWishlistButtonCount();

                    const searchKeywordEl = document.getElementById('search-keyword');
                    if (isWishlistMode) {
                        if (searchKeywordEl) searchKeywordEl.value = '';
                        renderWishlist();
                    } else {
                        renderStores(currentStores);
                    }
                };
            }

            function updateGuideText(r, addressName) {
                const guideEl = document.getElementById('guide-text-msg');
                if (!guideEl) return;
                
                let rangeStr = r >= 1000 ? `${(r / 1000).toFixed(1).replace(/\.0$/, '')}km` : `${r}m`;
                
                if (isWishlistMode) {
                    guideEl.innerHTML = `❤️ <strong>찜한 음식점 목록</strong>을 조회 중입니다. (${wishlist.length}개)`;
                    return;
                }

                if (addressName) {
                    guideEl.innerHTML = `📍 <strong>중심 위치:</strong> ${addressName}<br>📍 반경 <strong>${rangeStr}</strong> 내 음식점`;
                } else {
                    guideEl.innerHTML = `📍 현재 위치 기준 반경 <strong>${rangeStr}</strong> 내 음식점을 불러옵니다.`;
                }
            }

            function clearMarkers() {
                currentMarkers.forEach(item => item.marker.setMap(null));
                currentMarkers = [];
                if (activePopupOverlay) {
                    activePopupOverlay.setMap(null);
                    activePopupOverlay = null;
                }
            }

            function getDistanceFromLatLonInMeters(lat1, lon1, lat2, lon2) {
                const R = 6371000;
                const dLat = deg2rad(lat2 - lat1);
                const dLon = deg2rad(lon2 - lon1);
                const a = 
                    Math.sin(dLat/2) * Math.sin(dLat/2) +
                    Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * 
                    Math.sin(dLon/2) * Math.sin(dLon/2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
                return Math.round(R * c);
            }

            function deg2rad(deg) { return deg * (Math.PI/180); }

            function generateMockTel(storeId, address) {
                if (address && address.includes('서울')) {
                    const tail = String(Math.abs(hashCode(storeId || 'seoul')) % 9000 + 1000);
                    return `02-${tail}-${tail}`;
                } else {
                    const tail = String(Math.abs(hashCode(storeId || 'store')) % 9000 + 1000);
                    return `031-${tail}-${tail}`;
                }
            }

            function hashCode(str) {
                let hash = 0;
                for (let i = 0; i < str.length; i++) {
                    hash = ((hash << 5) - hash) + str.charCodeAt(i);
                    hash |= 0;
                }
                return hash;
            }

            function getStoreRatingAndReviews(store) {
                const hashVal = Math.abs(hashCode(store.bizesId || store.bizesNm || 'store'));
                const rating = (4.0 + (hashVal % 11) * 0.1).toFixed(1);
                const reviewCount = (hashVal % 85) + 8;
                return { rating, reviewCount };
            }

            function getFoodCategory(indsName, indsLargeName, storeName) {
                if (!indsName) indsName = '';
                if (!indsLargeName) indsLargeName = '';
                if (!storeName) storeName = '';

                const text = (indsName + ' ' + indsLargeName + ' ' + storeName).toLowerCase();
                const excludeKeywords = [
                    '부동산', '중개', '미용', '헤어', '뷰티', '피부', '욕탕', '사우나', '찜질', 
                    '세탁', '크리닝', 'pc방', '컴퓨터', '당구장', '오락', '약국', '병원', '의원', 
                    '치과', '한의원', '학원', '교습', '교육', '문구', '서적', '주유소', '충전소', 
                    '골프', '헬스', '운동', '스포츠', '정비', '카센터', '임대', '소모품', '안경',
                    '의류', '패션', '신발', '가전', '핸드폰', '꽃집', '애완', '반려', '인테리어',
                    '철물', '조명', '가구', '사진', '스튜디오', '공방', '인쇄', '기획', '세무',
                    '회계', '법무', '노무', '신문', '종교', '교회', '사찰', '성당', '안마', '마사지'
                ];

                for (const keyword of excludeKeywords) {
                    if (text.includes(keyword)) return null;
                }

                const foodCheckKeywords = [
                    '식당', '음식', '요리', '한식', '중식', '일식', '양식', '분식', '구이', '찌개',
                    '국밥', '회', '초밥', '고기', '냉면', '백반', '면', '족발', '보쌈', '치킨',
                    '호프', '주점', '카페', '커피', '제과', '빵', '패스트푸드', '피자', '햄버거'
                ];

                let isFood = false;
                for (const fk of foodCheckKeywords) {
                    if (text.includes(fk)) {
                        isFood = true;
                        break;
                    }
                }

                if (!isFood) return null;

                if (text.includes('한식') || text.includes('국밥') || text.includes('고기') || text.includes('냉면') || text.includes('백반') || text.includes('삼겹살') || text.includes('찌개') || text.includes('국수') || text.includes('갈비') || text.includes('탕')) return '한식';
                if (text.includes('중식') || text.includes('짜장') || text.includes('짬뽕')) return '중식';
                if (text.includes('일식') || text.includes('초밥') || text.includes('회') || text.includes('돈가스') || text.includes('우동')) return '일식/회';
                if (text.includes('양식') || text.includes('피자') || text.includes('패밀리') || text.includes('스테이크') || text.includes('파스타')) return '양식/패스트푸드';
                if (text.includes('커피') || text.includes('카페') || text.includes('디저트') || text.includes('제과') || text.includes('빵')) return '카페/디저트';
                if (text.includes('분식') || text.includes('김밥') || text.includes('떡볶이')) return '분식';
                if (text.includes('치킨') || text.includes('호프') || text.includes('주점') || text.includes('포차') || text.includes('맥주')) return '치킨/술집';
                
                return '기타 음식점';
            }

            // 커스텀 오버레이를 활용한 슬림한 풍선말 팝업 구현
            function createCustomPopup(store, position) {
                if (activePopupOverlay) {
                    activePopupOverlay.setMap(null);
                    activePopupOverlay = null;
                }

                const name = store.bizesNm || '상호명 없음';
                const address = store.rdnmAdr || store.lnoAdr || '주소 정보 없음';
                const tel = (store.telno && store.telno.trim() !== '') ? store.telno : generateMockTel(store.bizesId, address);
                const category = store.indsSclsNm || '음식점';
                const mapUrl = getMapSearchUrl(name, address);
                const isW = isWished(store);
                const wishIcon = isW ? '❤️' : '🤍';
                const { rating, reviewCount } = getStoreRatingAndReviews(store);

                class CustomPopupOverlay extends google.maps.OverlayView {
                    constructor(pos, contentHtml) {
                        super();
                        this.position = pos;
                        this.contentHtml = contentHtml;
                        this.div = null;
                    }

                    onAdd() {
                        this.div = document.createElement('div');
                        this.div.style.position = 'absolute';
                        this.div.innerHTML = this.contentHtml;
                        
                        const panes = this.getPanes();
                        panes.floatPane.appendChild(this.div);

                        // 이벤트 전파 방지
                        this.div.onclick = (e) => e.stopPropagation();
                    }

                    draw() {
                        const projection = this.getProjection();
                        if (!projection) return;
                        const point = projection.fromLatLngToDivPixel(this.position);
                        if (point) {
                            this.div.style.left = point.x + 'px';
                            this.div.style.top = point.y + 'px';
                        }
                    }

                    onRemove() {
                        if (this.div) {
                            this.div.parentNode.removeChild(this.div);
                            this.div = null;
                        }
                    }
                }

                const popupHtml = `
                    <div class="custom-popup-bubble">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
                            <a href="${mapUrl}" target="_blank" style="font-weight:bold; font-size:14px; color:#2563eb; text-decoration:none; max-width: 140px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${name}</a>
                            <span style="background:#fffbeb; color:#d97706; font-size:10px; padding:2px 5px; border-radius:4px; font-weight:bold; border:1px solid #fef3c7;">⭐ ${rating}</span>
                        </div>
                        <div style="font-size:11px; color:#64748b; margin-bottom:2px;">[${category}]</div>
                        <div style="font-size:11px; color:#475569; margin-bottom:2px; line-height:1.2;">📍 ${address}</div>
                        <div style="font-size:11px; color:#64748b; margin-bottom:6px;">☎️ ${tel}</div>
                        <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid #f1f5f9; padding-top:6px;">
                            <span style="font-size:10px; color:#94a3b8;">약 ${store.distanceMeters}m 거리</span>
                            <div style="display:flex; gap:4px;">
                                <button onclick="window.toggleWishFromWindow('${getStoreKey(store)}')" style="background:#f8fafc; border:1px solid #cbd5e1; border-radius:4px; padding:2px 6px; cursor:pointer; font-size:11px; font-weight:bold; color:#334155;">
                                    ${wishIcon} 찜
                                </button>
                                <button id="popup-close-btn" style="background:#e2e8f0; border:none; border-radius:4px; padding:2px 6px; cursor:pointer; font-size:11px; font-weight:bold; color:#475569;">
                                    닫기
                                </button>
                            </div>
                        </div>
                    </div>
                `;

                const popup = new CustomPopupOverlay(position, popupHtml);
                popup.setMap(map);
                activePopupOverlay = popup;

                setTimeout(() => {
                    const closeBtn = document.getElementById('popup-close-btn');
                    if (closeBtn) {
                        closeBtn.onclick = () => {
                            popup.setMap(null);
                            activePopupOverlay = null;
                            if (store._cardElement) store._cardElement.classList.remove('selected');
                        };
                    }
                }, 50);

                document.querySelectorAll('.store-card').forEach(c => c.classList.remove('selected'));
                if (store._cardElement) {
                    store._cardElement.classList.add('selected');
                    store._cardElement.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }

            function renderStores(storesToRender) {
                const listContainer = document.getElementById('store-list-container');
                if (!listContainer) return;
                listContainer.innerHTML = '';
                clearMarkers();

                if (!storesToRender || storesToRender.length === 0) {
                    listContainer.innerHTML = '<p style="text-align: center; color: #888; margin-top: 30px;">검색 결과가 없습니다.</p>';
                    return;
                }

                const groups = {};

                storesToRender.forEach((store) => {
                    const groupKey = getFoodCategory(store.indsSclsNm, store.indsLclsNm, store.bizesNm);
                    if (!groupKey) return; 

                    if (!groups[groupKey]) groups[groupKey] = [];
                    groups[groupKey].push(store);

                    const storeLat = parseFloat(store.lat || store.y);
                    const storeLon = parseFloat(store.lon || store.lng || store.x);
                    const name = store.bizesNm || '상호명 없음';
                    const address = store.rdnmAdr || store.lnoAdr || '주소 정보 없음';
                    const tel = (store.telno && store.telno.trim() !== '') ? store.telno : generateMockTel(store.bizesId, address);
                    const category = store.indsSclsNm || '음식점';
                    const mapUrl = getMapSearchUrl(name, address);

                    const distanceMeters = getDistanceFromLatLonInMeters(centerLat, centerLng, storeLat, storeLon);
                    store.distanceMeters = distanceMeters;
                    
                    const { rating, reviewCount } = getStoreRatingAndReviews(store);
                    store.rating = parseFloat(rating);
                    store.reviewCount = reviewCount;

                    if (!isNaN(storeLat) && !isNaN(storeLon)) {
                        const markerPosition = { lat: storeLat, lng: storeLon };
                        const marker = new google.maps.Marker({
                            position: markerPosition,
                            map: map
                        });

                        marker.addListener('click', function() {
                            createCustomPopup(store, markerPosition);
                        });

                        currentMarkers.push({ marker, store });
                    }
                });

                let totalCount = 0;
                for (const [groupName, storeList] of Object.entries(groups)) {
                    totalCount += storeList.length;
                    const section = document.createElement('div');
                    section.className = 'group-section';

                    const titleDiv = document.createElement('div');
                    titleDiv.className = 'group-title';
                    titleDiv.innerHTML = `
                        <span>🍴 ${groupName}</span>
                        <div class="group-count-wrap">
                            <span class="group-count">${storeList.length}개</span>
                            <span class="toggle-icon" style="transform: ${isAllCollapsed ? 'rotate(-90deg)' : 'rotate(0deg)'};">▼</span>
                        </div>
                    `;

                    const contentDiv = document.createElement('div');
                    contentDiv.className = 'group-content' + (isAllCollapsed ? ' collapsed' : '');

                    titleDiv.onclick = function(e) {
                        e.stopPropagation();
                        const isCollapsed = contentDiv.classList.toggle('collapsed');
                        const icon = titleDiv.querySelector('.toggle-icon');
                        if (icon) icon.style.transform = isCollapsed ? 'rotate(-90deg)' : 'rotate(0deg)';
                    };

                    section.appendChild(titleDiv);
                    section.appendChild(contentDiv);

                    storeList.sort((a, b) => {
                        if (b.rating !== a.rating) return b.rating - a.rating;
                        if (b.reviewCount !== a.reviewCount) return b.reviewCount - a.reviewCount;
                        return a.distanceMeters - b.distanceMeters;
                    });

                    storeList.forEach((store) => {
                        const name = store.bizesNm || '상호명 없음';
                        const category = store.indsSclsNm || '업종 정보 없음';
                        const address = store.rdnmAdr || store.lnoAdr || '주소 정보 없음';
                        const tel = (store.telno && store.telno.trim() !== '') ? store.telno : generateMockTel(store.bizesId, address);
                        const mapUrl = getMapSearchUrl(name, address);
                        const ratingBadgeHtml = `<span class="rating-badge">⭐ ${store.rating} (${store.reviewCount})</span>`;
                        const isW = isWished(store);

                        const card = document.createElement('div');
                        card.className = 'store-card';
                        store._cardElement = card; 

                        card.innerHTML = `
                            <div class="store-name">
                                <span><a href="${mapUrl}" target="_blank" onclick="event.stopPropagation();">${name}</a> ${ratingBadgeHtml}</span>
                                <div style="display:flex; align-items:center; gap:6px;">
                                    <button class="wish-btn" title="찜하기">${isW ? '❤️' : '🤍'}</button>
                                </div>
                            </div>
                            <div class="store-info">📍 ${address}</div>
                            <div class="store-info">☎️ ${tel} | 📏 ${store.distanceMeters}m</div>
                            <div class="store-category">🏷️ ${category}</div>
                        `;

                        const wishBtn = card.querySelector('.wish-btn');
                        if (wishBtn) {
                            wishBtn.onclick = function(e) {
                                toggleWish(store, e);
                            };
                        }

                        card.onclick = function(e) {
                            e.stopPropagation();
                            const storeLat = parseFloat(store.lat || store.y);
                            const storeLon = parseFloat(store.lon || store.lng || store.x);
                            if (!isNaN(storeLat) && !isNaN(storeLon)) {
                                const pos = { lat: storeLat, lng: storeLon };
                                map.panTo(pos);
                                createCustomPopup(store, pos);
                            }
                        };

                        contentDiv.appendChild(card);
                    });

                    listContainer.appendChild(section);
                }

                if (totalCount === 0) {
                    listContainer.innerHTML = '<p style="text-align: center; color: #888; margin-top: 30px;">반경 내 음식점이 없습니다.</p>';
                }
            }

            window.toggleWishFromWindow = function(storeKey) {
                const foundStore = currentStores.find(s => getStoreKey(s) === storeKey);
                if (foundStore) {
                    toggleWish(foundStore);
                } else {
                    const index = wishlist.indexOf(storeKey);
                    if (index > -1) wishlist.splice(index, 1);
                    else wishlist.push(storeKey);
                    localStorage.setItem('my_store_wishlist', JSON.stringify(wishlist));
                    updateWishlistButtonCount();
                    renderWishlist();
                }
            };

            function renderWishlist() {
                const listContainer = document.getElementById('store-list-container');
                if (!listContainer) return;
                listContainer.innerHTML = '';
                clearMarkers();
                updateGuideText(radius, null);

                if (wishlist.length === 0) {
                    listContainer.innerHTML = '<p style="text-align: center; color: #888; margin-top: 50px;">찜한 음식점이 없습니다. 마음에 드는 식당에 하트를 눌러보세요!</p>';
                    return;
                }

                const wishedStores = [];
                wishlist.forEach(key => {
                    let matched = currentStores.find(s => getStoreKey(s) === key);
                    if (!matched) {
                        matched = {
                            bizesId: key,
                            bizesNm: key.split('_')[0] || '찜한 음식점',
                            rdnmAdr: key.split('_')[1] || '주소 정보 없음',
                            lat: centerLat,
                            lon: centerLng,
                            distanceMeters: 0
                        };
                    }
                    wishedStores.push(matched);
                });

                const contentDiv = document.createElement('div');
                contentDiv.className = 'group-content';

                wishedStores.forEach((store) => {
                    const name = store.bizesNm || '상호명 없음';
                    const address = store.rdnmAdr || store.lnoAdr || '주소 정보 없음';
                    const tel = (store.telno && store.telno.trim() !== '') ? store.telno : generateMockTel(store.bizesId, address);
                    const category = store.indsSclsNm || '즐겨찾기 맛집';
                    const mapUrl = getMapSearchUrl(name, address);
                    const { rating, reviewCount } = getStoreRatingAndReviews(store);
                    const ratingBadgeHtml = `<span class="rating-badge">⭐ ${rating} (${reviewCount})</span>`;
                    const storeLat = parseFloat(store.lat || store.y);
                    const storeLon = parseFloat(store.lon || store.lng || store.x);

                    if (!isNaN(storeLat) && !isNaN(storeLon)) {
                        const markerPosition = { lat: storeLat, lng: storeLon };
                        const marker = new google.maps.Marker({
                            position: markerPosition,
                            map: map
                        });

                        marker.addListener('click', function() {
                            createCustomPopup(store, markerPosition);
                        });

                        currentMarkers.push({ marker, store });
                    }

                    const card = document.createElement('div');
                    card.className = 'store-card';
                    store._cardElement = card;

                    card.innerHTML = `
                        <div class="store-name">
                            <span><a href="${mapUrl}" target="_blank" onclick="event.stopPropagation();">${name}</a> ${ratingBadgeHtml}</span>
                            <div style="display:flex; align-items:center; gap:6px;">
                                <button class="wish-btn" title="찜 해제">❤️</button>
                            </div>
                        </div>
                        <div class="store-info">📍 ${address}</div>
                        <div class="store-info">☎️ ${tel}</div>
                        <div class="store-category">🏷️ ${category}</div>
                    `;

                    const wishBtn = card.querySelector('.wish-btn');
                    if (wishBtn) {
                        wishBtn.onclick = function(e) {
                            toggleWish(store, e);
                        };
                    }

                    card.onclick = function(e) {
                        e.stopPropagation();
                        if (!isNaN(storeLat) && !isNaN(storeLon)) {
                            const pos = { lat: storeLat, lng: storeLon };
                            map.panTo(pos);
                            createCustomPopup(store, pos);
                        }
                    };

                    contentDiv.appendChild(card);
                });

                const section = document.createElement('div');
                section.className = 'group-section';
                section.innerHTML = `<div class="group-title" style="cursor:default;"><span>❤️ 찜한 맛집 모음</span><span class="group-count">${wishedStores.length}개</span></div>`;
                section.appendChild(contentDiv);
                listContainer.appendChild(section);
            }

            async function loadStores(lat, lng) {
                if (isWishlistMode) return; 

                try {
                    let response;
                    try {
                        response = await fetch(`/api/stores/radius?cx=${lng}&cy=${lat}&radius=${radius}`);
                    } catch (e) {
                        response = await fetch(`http://localhost:3000/api/stores/radius?cx=${lng}&cy=${lat}&radius=${radius}`);
                    }
                    
                    const data = await response.json();

                    let items = [];
                    if (data?.body?.items) items = data.body.items;
                    else if (Array.isArray(data)) items = data;

                    if (!Array.isArray(items)) items = items ? [items] : [];

                    currentStores = items.filter(store => getFoodCategory(store.indsSclsNm, store.indsLclsNm, store.bizesNm) !== null);

                    const searchKeywordEl = document.getElementById('search-keyword');
                    if (searchKeywordEl) searchKeywordEl.value = '';
                    renderStores(currentStores);

                } catch (error) {
                    console.error('데이터 로드 실패:', error);
                    const storeListContainer = document.getElementById('store-list-container');
                    if (storeListContainer) {
                        storeListContainer.innerHTML = '<p style="color:red; text-align:center;">데이터를 불러오지 못했습니다.</p>';
                    }
                }
            }

            function filterStores() {
                if (isWishlistMode) return;
                const searchKeywordEl = document.getElementById('search-keyword');
                if (!searchKeywordEl) return;
                
                const rawKeyword = searchKeywordEl.value;
                const keyword = rawKeyword.replace(/\s+/g, '').toLowerCase();

                if (!keyword) {
                    renderStores(currentStores);
                    return;
                }

                const filtered = currentStores.filter(store => {
                    const name = (store.bizesNm || '').replace(/\s+/g, '').toLowerCase();
                    const category = (store.indsSclsNm || '').replace(/\s+/g, '').toLowerCase();
                    return name.includes(keyword) || category.includes(keyword);
                });

                renderStores(filtered);
            }

            const searchBtn = document.getElementById('search-btn');
            if (searchBtn) searchBtn.onclick = filterStores;

            const searchKeywordEl = document.getElementById('search-keyword');
            if (searchKeywordEl) {
                searchKeywordEl.onkeyup = function(event) {
                    (event.key === 'Enter') && filterStores();
                };
            }

            const mapPlatformSelect = document.getElementById('map-platform-select');
            if (mapPlatformSelect) {
                mapPlatformSelect.onchange = function() {
                    if (isWishlistMode) {
                        renderWishlist();
                    } else {
                        renderStores(currentStores);
                    }
                };
            }

            function updateCenterMarker(latLngObj) {
                if (centerMarker) centerMarker.setMap(null);
                if (centerCircle) centerCircle.setMap(null);

                centerMarker = new google.maps.Marker({
                    position: latLngObj,
                    map: map,
                    icon: {
                        url: 'https://maps.google.com/mapfiles/ms/icons/red-dot.png'
                    }
                });

                centerCircle = new google.maps.Circle({
                    strokeColor: '#2563eb',
                    strokeOpacity: 0.8,
                    strokeWeight: 2,
                    fillColor: '#2563eb',
                    fillOpacity: 0.1,
                    map: map,
                    center: latLngObj,
                    radius: radius
                });

                updateGuideText(radius, null);

                geocoder.geocode({ location: latLngObj }, function(results, status) {
                    if (status === 'OK' && results[0]) {
                        let fullAddress = results[0].formatted_address || '주소 정보 없음';
                        updateGuideText(radius, fullAddress);
                    }
                });
            }

            const currentLocationBtn = document.getElementById('current-location-btn');
            if (currentLocationBtn) {
                currentLocationBtn.onclick = function(e) {
                    e.stopPropagation();
                    if (!navigator.geolocation) {
                        alert('이 브라우저는 위치 정보를 지원하지 않습니다.');
                        return;
                    }

                    if (isWishlistMode) {
                        isWishlistMode = false;
                        updateWishlistButtonCount();
                    }

                    const storeListContainer = document.getElementById('store-list-container');
                    if (storeListContainer) {
                        storeListContainer.innerHTML = '<p style="text-align: center; color: #888; margin-top: 50px;">현재 위치를 가져오는 중...</p>';
                    }

                    navigator.geolocation.getCurrentPosition(
                        function(position) {
                            centerLat = position.coords.latitude;
                            centerLng = position.coords.longitude;

                            const currentLatLng = { lat: centerLat, lng: centerLng };
                            map.setCenter(currentLatLng);
                            updateCenterMarker(currentLatLng);
                            loadStores(centerLat, centerLng);
                        },
                        function(error) {
                            alert('현재 위치를 가져오지 못했습니다. 위치 권한을 확인해주세요.');
                            console.warn(error);
                        },
                        { timeout: 10000, maximumAge: 0 }
                    );
                };
            }

            map.addListener('zoom_changed', function() {
                const newZoom = map.getZoom();
                if (newZoom !== currentZoom) {
                    currentZoom = newZoom;
                    radius = getRadiusByZoom(currentZoom);
                    
                    const fixedLatLng = { lat: centerLat, lng: centerLng };
                    updateCenterMarker(fixedLatLng);
                    loadStores(centerLat, centerLng);
                }
            });

            map.addListener('click', function(mouseEvent) {
                if (window.innerWidth <= 768) {
                    sidebar.style.height = heights[0];
                    currentHeightIndex = 0;
                    sizeToggleArrowBtn.textContent = '▲';
                }

                if (activePopupOverlay) {
                    activePopupOverlay.setMap(null);
                    activePopupOverlay = null;
                }
                document.querySelectorAll('.store-card').forEach(c => c.classList.remove('selected'));

                const latlng = mouseEvent.latLng;
                centerLat = latlng.lat();
                centerLng = latlng.lng();

                if (isWishlistMode) {
                    isWishlistMode = false;
                    updateWishlistButtonCount();
                }

                const latLngObj = { lat: centerLat, lng: centerLng };
                updateCenterMarker(latLngObj);
                loadStores(centerLat, centerLng);
            });

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(pathPosition) {
                        centerLat = pathPosition.coords.latitude;
                        centerLng = pathPosition.coords.longitude;

                        const currentLatLng = { lat: centerLat, lng: centerLng };
                        map.setCenter(currentLatLng);
                        updateCenterMarker(currentLatLng);
                        loadStores(centerLat, centerLng);
                    },
                    function(error) {
                        console.warn('현재 위치를 가져올 수 없어 기본 위치로 대체합니다.', error);
                        const defaultLatLng = { lat: centerLat, lng: centerLng };
                        updateCenterMarker(defaultLatLng);
                        loadStores(centerLat, centerLng);
                    },
                    { timeout: 10000, maximumAge: 0 }
                );
            } else {
                const defaultLatLng = { lat: centerLat, lng: centerLng };
                updateCenterMarker(defaultLatLng);
                loadStores(centerLat, centerLng);
            }
        };
    </script>
</body>
</html>
