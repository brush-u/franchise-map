<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>음식점 데이터 정제 및 필터링 뷰어</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            margin-bottom: 20px;
            color: #2c3e50;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        button {
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        button:hover {
            background-color: #2980b9;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .stats div {
            background: #ecf0f1;
            padding: 10px 15px;
            border-radius: 4px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            font-size: 14px;
        }
        th {
            background-color: #f8f9fa;
            color: #2c3e50;
        }
        tr:hover {
            background-color: #f1f2f6;
        }
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
        }
        .badge-food {
            background-color: #e8f8f5;
            color: #1abc9c;
        }
        .badge-dropped {
            background-color: #fdebd0;
            color: #e67e22;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>원천 데이터 필터링 및 검증 시스템</h2>
    
    <div class="controls">
        <button onclick="runFilteringProcess()">데이터 정제 실행</button>
    </div>

    <div class="stats">
        <div id="totalCount">전체 원본: 0건</div>
        <div id="validCount">정상 음식점: 0건</div>
        <div id="droppedCount">차단된 비음식점: 0건</div>
    </div>

    <table>
        <thead>
            <tr>
                <th>상호명</th>
                <th>표준산업분류코드 (KSIC)</th>
                <th>주소</th>
                <th>상태</th>
            </tr>
        </thead>
        <tbody id="resultTableBody">
            <tr>
                <td colspan="4" style="text-align: center; color: #7f8c8d;">'데이터 정제 실행' 버튼을 눌러주세요.</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    // 시뮬레이션을 위한 샘플 원천 데이터 (건축사사무소 등 비음식점 오입력 데이터 포함)
    const rawApiData = [
        { bizesNm: "광명대창집 자곡점", ksicCd: "I56111", rdnmAdr: "서울특별시 강남구 자곡로 123" },
        { bizesNm: "시명종합건축사사무소", ksicCd: "M72110", rdnmAdr: "서울특별시 강남구 자곡로 45" },
        { bizesNm: "스타벅스 자곡사거리점", ksicCd: "I56220", rdnmAdr: "서울특별시 강남구 자곡로 78" },
        { bizesNm: "한국엔지니어링컨설팅", ksicCd: "M72120", rdnmAdr: "서울특별시 강남구 자곡로 99" },
        { bizesNm: "자곡본가한식당", ksicCd: "I56112", rdnmAdr: "서울특별시 강남구 자곡로 11" }
    ];

    function runFilteringProcess() {
        const ALLOWED_INDUSTRY_PREFIX = "I56";
        const EXCLUDE_KEYWORDS = ["건축사", "사무소", "엔지니어링", "부동산", "법무", "세무", "컨설팅", "연구소"];

        const validRestaurants = [];
        const droppedItems = [];

        rawApiData.forEach(item => {
            const ksicCode = String(item.ksicCd || "").trim();
            const bizName = String(item.bizesNm || "").trim();

            const isFoodIndustry = ksicCode.startsWith(ALLOWED_INDUSTRY_PREFIX);
            const hasExcludedKeyword = EXCLUDE_KEYWORDS.some(keyword => bizName.includes(keyword));

            if (isFoodIndustry && !hasExcludedKeyword) {
                validRestaurants.push({ ...item, status: 'valid' });
            } else {
                droppedItems.push({ ...item, status: 'dropped' });
            }
        });

        // 통계 업데이트
        document.getElementById('totalCount').innerText = `전체 원본: ${rawApiData.length}건`;
        document.getElementById('validCount').innerText = `정상 음식점: ${validRestaurants.length}건`;
        document.getElementById('droppedCount').innerText = `차단된 비음식점: ${droppedItems.length}건`;

        // 테이블 렌더링
        const tbody = document.getElementById('resultTableBody');
        tbody.innerHTML = '';

        const combinedResults = [...validRestaurants, ...droppedItems];
        combinedResults.forEach(item => {
            const tr = document.createElement('tr');
            
            const badgeClass = item.status === 'valid' ? 'badge-food' : 'badge-dropped';
            const badgeText = item.status === 'valid' ? '정상 승인' : '원천 차단';

            tr.innerHTML = `
                <td><strong>${item.bizesNm}</strong></td>
                <td>${item.ksicCd}</td>
                <td>${item.rdnmAdr}</td>
                <td><span class="badge ${badgeClass}">${badgeText}</span></td>
            `;
            tbody.appendChild(tr);
        });
    }
</script>

</body>
</html>
