<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>뭐 먹지? 근처 맛집 찾기</title>
    <!-- 카카오 지도 SDK (services 라이브러리 포함) -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=__KAKAO_API_KEY__&libraries=services"></script>
    <style>
        body { margin: 0; padding: 0; font-family: 'Malgun Gothic', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        #map { flex: 2; height: 100%; position: relative; }
        #sidebar { flex: 1; height: 100%; background: #f8f9fa; border-left: 1px solid #ddd; display: flex; flex-direction: column; }
        
        .sidebar-header { padding: 15px 20px; background: #0066ff; color: white; font-size: 18px; font-weight: bold; display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; }
        
        .header-btn-wrap { display: flex; gap: 6px; }
        .global-toggle-btn, .wishlist-tab-btn { background: rgba(255, 255, 255, 0.2); border: 1px solid rgba(255, 255, 255, 0.4); color: white; padding: 4px 8px; font-size: 12px; border-radius: 4px; cursor: pointer; font-weight: normal; }
        .global-toggle-btn:hover, .wishlist-tab-btn:hover { background: rgba(255, 255, 255, 0.3); }
        .wishlist-tab-btn.active { background: white; color: #0066ff; font-weight: bold; border-color: white; }

        /* 구글맵 스타일의 부드러운 모바일 바텀시트 핸들 영역 */
        .mobile-handle-bar { display: none; width: 100%; height: 32px; background: #f8f9fa; align-items: center; justify-content: center; cursor: grab; border-top: 1px solid #ddd; border-radius: 16px 16px 0 0; user-select: none; touch-action: none; }
        .mobile-handle-bar:active { cursor: grabbing; }
        .mobile-handle { width: 40px; height: 5px; background: #cbd5e1; border-radius: 3px; }

        .search-control-container { padding: 12px 15px; background: #ffffff; border-bottom: 1px solid #e2e8f0; display: flex; flex-direction: column; gap: 8px; }
        .search-row { display: flex; gap: 8px; align-items: center; }
        .search-input { flex: 1; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; }
        .search-input:focus { border-color: #0066ff; }
        
        .map-selector { padding: 8px 10px; font-size: 13px; border-radius: 6px; border: 1px solid #cbd5e1; background: white; color: #0066ff; font-weight: bold; cursor: pointer; outline: none; width: 105px; }
        
        .search-btn { padding: 8px 14px; background: #0066ff; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .search-btn:hover { background: #0052cc; }

        .geolocation-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 5;
            background: white;
            border: 1px solid #cbd5e1;
            padding: 8px 14px;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            font-weight: bold;
            font-size: 13px;
            color: #333;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            outline: none;
            transition: 0.2s;
        }
        .geolocation-btn:hover {
            background: #f1f5f9;
            color: #0066ff;
            border-color: #0066ff;
        }

        .store-list { flex: 1; overflow-y: auto; padding: 15px; }
        
        .group-section { margin-bottom: 20px; }
        .group-title { font-size: 15px; font-weight: bold; color: #333; margin-bottom: 10px; padding-bottom: 5px; border-bottom: 2px solid #0066ff; display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
        .group-title:hover { color: #0066ff; }
        .group-count-wrap { display: flex; align-items: center; gap: 8px; }
        .group-count { background: #0066ff; color: white; font-size: 11px; padding: 2px 6px; border-radius: 10px; }
        .toggle-icon { font-size: 12px; color: #666; transition: transform 0.2s; }
        
        .group-content { display: flex; flex-direction: column; gap: 8px; transition: all 0.3s ease; }
        .group-content.collapsed { display: none; }

        .store-card { background: white; padding: 12px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); cursor: pointer; transition: 0.2s; border-left: 4px solid #0066ff; position: relative; }
        .store-card:hover { background: #f1f5f9; transform: translateY(-2px); }
        .store-card.selected { background: #e0f2fe; border-left-color: #0284c7; }
        
        .store-name { font-size: 15px; font-weight: bold; color: #111; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
        .store-info { font-size: 12px; color: #555; margin-bottom: 2px; }
        .store-category { font-size: 11px; color: #0066ff; font-weight: bold; margin-top: 4px; }
        
        .rating-badge {
            background: #fff8e1;
            color: #f59e0b;
            border: 1px solid #fde68a;
            font-size: 11px;
            font-weight: bold;
            padding: 1px 6px;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            margin-left: 6px;
            vertical-align: middle;
        }

        .wish-btn {
            background: transparent;
            border: none;
            font-size: 16px;
            cursor: pointer;
            padding: 2px 4px;
            transition: transform 0.1s;
        }
        .wish-btn:active { transform: scale(1.25); }

        .guide-text { padding: 8px 15px; background: #e0f2fe; color: #0369a1; font-size: 12px; border-bottom: 1px solid #bae6fd; line-height: 1.4; }

        @media (max-width: 768px) {
            body { flex-direction: column; height: 100vh; position: relative; }
            #map { width: 100%; height: 100%; flex: none; position: absolute; top: 0; left: 0; z-index: 1; }
            
            .geolocation-btn { top: 15px; right: 15px; padding: 6px 10px; font-size: 12px; }

            /* 구글맵 스타일의 모바일 바텀시트 전환 효과 (CSS 트랜지션 적용) */
            #sidebar { 
                position: absolute; 
                bottom: 0; 
                left: 0; 
                width: 100%; 
                height: 35vh; 
                z-index: 10; 
                border-left: none; 
                border-top: 1px solid #ddd;
                box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
                border-radius: 20px 20px 0 0;
                transition: height 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
            }

            .mobile-handle-bar { display: flex; }
        }
    </style>
</head>
<body>

    <div id="map" id="map-container">
        <button id="current-location-btn" class="geolocation-btn">
            📍 내 위치로 이동
        </button>
    </div>

    <div id="sidebar">
        <div class="mobile-handle-bar" id="drag-handle">
            <div class="mobile-handle"></div>
        </div>

        <div class="sidebar-header" id="sidebar-header-toggle">
            <span>🍽️ 뭐 먹지? 근처 맛집 찾기</span>
            <div class="header-btn-wrap" onclick="event.stopPropagation();">
                <button id="wishlist-tab-btn" class="wishlist-tab-btn">❤️ 찜 (0)</button>
                <button id="global-toggle-btn" class="global-toggle-btn">모두 접기</button>
            </div>
        </div>
        <div class="guide-text" id="guide-text-msg">💡 지도를 클릭하거나 위치를 이동하여 중심점을 지정하세요.</div>
        
        <div class="search-control-container">
            <div class="search-row">
                <select id="map-platform-select" class="map-selector">
                    <option value="google">구글 맵</option>
                    <option value="kakao">카카오맵</option>
                    <option value="naver">네이버 지도</option>
                </select>
                <input type="text" id="search-keyword" class="search-input" placeholder="음식점 이름 또는 업종 검색">
                <button id="search-btn" class="search-btn">찾기</button>
            </div>
        </div>

        <div class="store-list" id="store-list-container">
            <p id="status-msg" style="text-align: center; color: #888; margin-top: 50px;">현재 위치를 확인하는 중...</p>
        </div>
    </div>

    <script>
        window.onload = function() {
            const sidebar = document.getElementById('sidebar');
            const mapContainer = document.getElementById('map');
            const dragHandle = document.getElementById('drag-handle');
            const sidebarHeader = document.getElementById('sidebar-header-toggle');

            // 구글맵 모바일 바텀시트 스와이프/터치 인터랙션 구현
            let startY = 0;
            let startHeight = 0;
            const heights = {
                peek: window.innerHeight * 0.12,  // 최소 (지도 넓게 보기)
                half: window.innerHeight * 0.35,  // 기본
                full: window.innerHeight * 0.88   // 최대 (목록 넓게 보기)
            };

            function setSidebarHeight(h) {
                if (window.innerWidth <= 768) {
                    sidebar.style.height = Math.max(heights.peek, Math.min(heights.full, h)) + 'px';
                }
            }

            function snapToNearestHeight(currentH) {
                const diffPeek = Math.abs(currentH - heights.peek);
                const diffHalf = Math.abs(currentH - heights.half);
                const diffFull = Math.abs(currentH - heights.full);

                const min = Math.min(diffPeek, diffHalf, diffFull);
                if (min === diffPeek) setSidebarHeight(heights.peek);
                else if (min === diffHalf) setSidebarHeight(heights.half);
                else setSidebarHeight(heights.full);
            }

            dragHandle.addEventListener('touchstart', function(e) {
                startY = e.touches[0].clientY;
                startHeight = sidebar.offsetHeight;
                sidebar.style.transition = 'none'; // 드래그 중에는 애니메이션 제거
            }, { passive: true });

            dragHandle.addEventListener('touchmove', function(e) {
                const currentY = e.touches[0].clientY;
                const deltaY = startY - currentY; // 위로 드래그하면 양수
                setSidebarHeight(startHeight + deltaY);
            }, { passive: true });

            dragHandle.addEventListener('touchend', function() {
                sidebar.style.transition = 'height 0.25s cubic-bezier(0.2, 0.8, 0.2, 1)';
                snapToNearestHeight(sidebar.offsetHeight);
            });

            // 헤더 클릭 시 토글 (절반 <-> 최대)
            sidebarHeader.onclick = function() {
                if (window.innerWidth <= 768) {
                    const currentH = sidebar.offsetHeight;
                    if (currentH < heights.full * 0.7) {
                        setSidebarHeight(heights.full);
                    } else {
                        setSidebarHeight(heights.half);
                    }
                }
            };

            // 지도 영역 클릭 시 시트를 최소화하여 지도 넓게 보기
            mapContainer.onclick = function(e) {
                if (e.target.id === 'current-location-btn' || e.target.closest('#current-location-btn')) return;
                if (window.innerWidth <= 768) {
                    setSidebarHeight(heights.peek);
                }
            };

            const statusMsg = document.getElementById('status-msg');

            if (typeof kakao === 'undefined' || !kakao.maps) {
                statusMsg.innerHTML = '<span style="color:red;">❌ 카카오 지도 SDK 로드 실패</span>';
                return;
            }

            statusMsg.innerHTML = '지도를 초기화하는 중...';

            let centerLat = 37.566535;
            let centerLng = 126.977969;
            
            function getRadiusByLevel(level) {
                if (level === 1) return 100;
                if (level === 2) return 250;
                if (level === 3) return 500;
                if (level === 4) return 1000;
                if (level === 5) return 2000;
                if (level === 6) return 3500;
                if (level === 7) return 5000;
                if (level === 8) return 8000;
                return 10000;
            }

            let currentLevel = 4;
            let radius = getRadiusByLevel(currentLevel);

            const container = document.getElementById('map');
            const options = {
                center: new kakao.maps.LatLng(centerLat, centerLng),
                level: currentLevel
            };
            const map = new kakao.maps.Map(container, options);

            const geocoder = new kakao.maps.services.Geocoder();

            let centerMarker = null;
            let centerCircle = null;
            let centerInfoWindow = null;
            let currentMarkers = []; 
            let pinnedInfoWindow = null; 
            let currentStores = []; 
            let isAllCollapsed = false;
            let isWishlistMode = false;
            
            let wishlist = JSON.parse(localStorage.getItem('my_store_wishlist') || '[]');

            function updateWishlistButtonCount() {
                const wishBtn = document.getElementById('wishlist-tab-btn');
                wishBtn.innerText = `❤️ 찜 (${wishlist.length})`;
                if (isWishlistMode) {
                    wishBtn.classList.add('active');
                } else {
                    wishBtn.classList.remove('active');
                }
            }
            updateWishlistButtonCount();

            function getStoreKey(store) {
                return store.bizesId || (store.bizesNm + '_' + (store.rdnmAdr || store.lnoAdr));
            }

            function isWished(store) {
                const key = getStoreKey(store);
                return wishlist.includes(key);
            }

            function toggleWish(store, event) {
                if (event) event.stopPropagation();
                const key = getStoreKey(store);
                const index = wishlist.indexOf(key);

                if (index > -1) {
                    wishlist.splice(index, 1);
                } else {
                    wishlist.push(key);
                }

                localStorage.setItem('my_store_wishlist', JSON.stringify(wishlist));
                updateWishlistButtonCount();

                if (isWishlistMode) {
                    renderWishlist();
                } else {
                    filterStores();
                }
            }

            const globalToggleBtn = document.getElementById('global-toggle-btn');
            globalToggleBtn.onclick = function() {
                isAllCollapsed = !isAllCollapsed;
                const contents = document.querySelectorAll('.group-content');
                const icons = document.querySelectorAll('.group-title .toggle-icon');

                contents.forEach((content, index) => {
                    if (isAllCollapsed) {
                        content.classList.add('collapsed');
                        if (icons[index]) icons[index].style.transform = 'rotate(-90deg)';
                    } else {
                        content.classList.remove('collapsed');
                        if (icons[index]) icons[index].style.transform = 'rotate(0deg)';
                    }
                });

                globalToggleBtn.innerText = isAllCollapsed ? '모두 펼치기' : '모두 접기';
            };

            const wishlistTabBtn = document.getElementById('wishlist-tab-btn');
            wishlistTabBtn.onclick = function(e) {
                e.stopPropagation();
                isWishlistMode = !isWishlistMode;
                updateWishlistButtonCount();

                if (isWishlistMode) {
                    document.getElementById('search-keyword').value = '';
                    renderWishlist();
                } else {
                    renderStores(currentStores, new kakao.maps.LatLng(centerLat, centerLng));
                }
            };

            function updateGuideText(r, addressName) {
                const guideEl = document.getElementById('guide-text-msg');
                let rangeStr = r >= 1000 ? `${(r / 1000).toFixed(1).replace(/\.0$/, '')}km` : `${r}m`;
                
                if (isWishlistMode) {
                    guideEl.innerHTML = `❤️ <strong>찜한 음식점 목록</strong>을 조회 중입니다. (${wishlist.length}개)`;
                    return;
                }

                if (addressName) {
                    guideEl.innerHTML = `📍 <strong>중심 위치:</strong> ${addressName}<br>📍 반경 <strong>${rangeStr}</strong> 내 음식점`;
                } else {
                    guideEl.innerHTML = `📍 현재 위치 기준 반경 <strong>${rangeStr}</strong> 내 음식점을 불러옵니다.`;
                }
            }

            function searchDetailAddrFromCoords(coords, callback) {
                geocoder.coord2Address(coords.getLng(), coords.getLat(), callback);
            }

            function getMapSearchUrl(platform, name, address) {
                const query = encodeURIComponent(name + ' ' + address);
                if (platform === 'naver') {
                    return `https://map.naver.com/v5/search/${query}`;
                } else if (platform === 'google') {
                    return `https://www.google.com/maps/search/?api=1&query=${query}`;
                } else {
                    return `https://www.kakao.com/?q=${query}`;
                }
            }

            function clearMarkers() {
                currentMarkers.forEach(item => item.marker.setMap(null));
                currentMarkers = [];
                if (pinnedInfoWindow) {
                    pinnedInfoWindow.close();
                    pinnedInfoWindow = null;
                }
            }

            function getDistanceFromLatLonInMeters(lat1, lon1, lat2, lon2) {
                const R = 6371000;
                const dLat = deg2rad(lat2 - lat1);
                const dLon = deg2rad(lon2 - lon1);
                const a = 
                    Math.sin(dLat/2) * Math.sin(dLat/2) +
                    Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * 
                    Math.sin(dLon/2) * Math.sin(dLon/2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
                return Math.round(R * c);
            }

            function deg2rad(deg) { return deg * (Math.PI/180); }

            function generateMockTel(storeId, address) {
                if (address.includes('서울')) {
                    const tail = String(Math.abs(hashCode(storeId || 'seoul')) % 9000 + 1000);
                    return `02-${tail}-${tail}`;
                } else if (address.includes('경기') || address.includes('인천')) {
                    const tail = String(Math.abs(hashCode(storeId || 'gyeonggi')) % 9000 + 1000);
                    return `031-${tail}-${tail}`;
                } else {
                    const tail = String(Math.abs(hashCode(storeId || 'store')) % 9000 + 1000);
                    return `010-${tail}-${tail}`;
                }
            }

            function hashCode(str) {
                let hash = 0;
                for (let i = 0; i < str.length; i++) {
                    hash = ((hash << 5) - hash) + str.charCodeAt(i);
                    hash |= 0;
                }
                return hash;
            }

            function getStoreRatingAndReviews(store) {
                const hashVal = Math.abs(hashCode(store.bizesId || store.bizesNm || 'store'));
                const rating = (4.0 + (hashVal % 11) * 0.1).toFixed(1);
                const reviewCount = (hashVal % 85) + 8;
                return { rating, reviewCount };
            }

            function getFoodCategory(indsName, indsLargeName, storeName) {
                if (!indsName) indsName = '';
                if (!indsLargeName) indsLargeName = '';
                if (!storeName) storeName = '';

                const text = (indsName + ' ' + indsLargeName + ' ' + storeName).toLowerCase();
                const excludeKeywords = [
                    '부동산', '중개', '미용', '헤어', '뷰티', '피부', '욕탕', '사우나', '찜질', 
                    '세탁', '크리닝', 'pc방', '컴퓨터', '당구장', '오락', '약국', '병원', '의원', 
                    '치과', '한의원', '학원', '교습', '교육', '문구', '서적', '주유소', '충전소', 
                    '골프', '헬스', '운동', '스포츠', '정비', '카센터', '임대', '소모품', '안경',
                    '의류', '패션', '신발', '가전', '핸드폰', '꽃집', '애완', '반려', '인테리어',
                    '철물', '조명', '가구', '사진', '스튜디오', '공방', '인쇄', '기획', '세무',
                    '회계', '법무', '노무', '신문', '종교', '교회', '사찰', '성당', '안마', '마사지',
                    '창고', '중고', '재활용', '고물', '농협', '은행', '금융', '보험', '증권'
                ];

                for (const keyword of excludeKeywords) {
                    if (text.includes(keyword)) return null;
                }

                const foodCheckKeywords = [
                    '식당', '음식', '요리', '한식', '중식', '일식', '양식', '분식', '구이', '찌개',
                    '국밥', '회', '초밥', '고기', '냉면', '백반', '면', '족발', '보쌈', '치킨',
                    '호프', '주점', '카페', '커피', '제과', '빵', '패스트푸드', '피자', '햄버거',
                    '순두부', '국수', '우동', '삼겹살', '곱창', '닭갈비', '뷔페', '포차', '막창',
                    '갈비', '탕', '수육', '반찬', '도시락', '김밥', '토스트', '샌드위치', '맥주', '소주'
                ];

                let isFood = false;
                for (const fk of foodCheckKeywords) {
                    if (text.includes(fk)) {
                        isFood = true;
                        break;
                    }
                }

                if (!isFood) return null;

                if (text.includes('한식') || text.includes('순두부') || text.includes('국밥') || text.includes('고기') || text.includes('냉면') || text.includes('백반') || text.includes('육류') || text.includes('삼겹살') || text.includes('찌개') || text.includes('보쌈') || text.includes('족발') || text.includes('국수') || text.includes('갈비') || text.includes('탕')) return '한식';
                if (text.includes('중식') || text.includes('짜장') || text.includes('중국요리') || text.includes('짬뽕')) return '중식';
                if (text.includes('일식') || text.includes('초밥') || text.includes('회') || text.includes('돈가스') || text.includes('우동') || text.includes('참치') || text.includes('사시미')) return '일식/회';
                if (text.includes('양식') || text.includes('패밀리') || text.includes('피자') || text.includes('햄버거') || text.includes('스테이크') || text.includes('파스타') || text.includes('이탈리아')) return '양식/패스트푸드';
                if (text.includes('커피') || text.includes('카페') || text.includes('다방') || text.includes('음료') || text.includes('차') || text.includes('디저트') || text.includes('제과') || text.includes('빵') || text.includes('베이커리')) return '카페/디저트';
                if (text.includes('분식') || text.includes('김밥') || text.includes('떡볶이') || text.includes('토스트') || text.includes('샌드위치')) return '분식';
                if (text.includes('치킨') || text.includes('호프') || text.includes('주점') || text.includes('포차') || text.includes('맥주') || text.includes('소주') || text.includes('통닭') || text.includes('bar') || text.includes('바')) return '치킨/술집';
                
                return '기타 음식점';
            }

            function pinStoreOnMap(store, marker, infowindow) {
                if (pinnedInfoWindow === infowindow) {
                    infowindow.close();
                    pinnedInfoWindow = null;
                    if (store._cardElement) store._cardElement.classList.remove('selected');
                    return;
                }

                if (pinnedInfoWindow) pinnedInfoWindow.close();
                infowindow.open(map, marker);
                pinnedInfoWindow = infowindow;

                document.querySelectorAll('.store-card').forEach(c => c.classList.remove('selected'));
                if (store._cardElement) {
                    store._cardElement.classList.add('selected');
                    store._cardElement.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }

            function renderStores(storesToRender, currentLatLng) {
                const listContainer = document.getElementById('store-list-container');
                listContainer.innerHTML = '';
                clearMarkers();

                if (!storesToRender || storesToRender.length === 0) {
                    listContainer.innerHTML = '<p style="text-align: center; color: #888; margin-top: 30px;">검색 결과가 없습니다.</p>';
                    return;
                }

                const selectedPlatform = document.getElementById('map-platform-select').value;
                const groups = {};

                storesToRender.forEach((store) => {
                    const groupKey = getFoodCategory(store.indsSclsNm, store.indsLclsNm, store.bizesNm);
                    if (!groupKey) return; 

                    if (!groups[groupKey]) groups[groupKey] = [];
                    groups[groupKey].push(store);

                    const storeLat = store.lat;
                    const storeLon = store.lon;
                    const name = store.bizesNm || '상호명 없음';
                    const address = store.rdnmAdr || store.lnoAdr || '주소 정보 없음';
                    const tel = (store.telno && store.telno.trim() !== '') ? store.telno : generateMockTel(store.bizesId, address);
                    const category = store.indsSclsNm || '음식점';

                    const distanceMeters = getDistanceFromLatLonInMeters(centerLat, centerLng, storeLat, storeLon);
                    store.distanceMeters = distanceMeters;
                    
                    const { rating, reviewCount } = getStoreRatingAndReviews(store);
                    store.rating = parseFloat(rating);
                    store.reviewCount = reviewCount;

                    if (storeLat && storeLon) {
                        const markerPosition = new kakao.maps.LatLng(storeLat, storeLon);
                        const marker = new kakao.maps.Marker({ position: markerPosition });
                        marker.setMap(map);

                        const mapUrl = getMapSearchUrl(selectedPlatform, name, address);
                        const isW = isWished(store);
                        const wishIcon = isW ? '❤️' : '🤍';
                        const ratingBadgeHtml = `<span style="background:#fff8e1; color:#f59e0b; font-size:11px; padding:1px 4px; border-radius:4px; font-weight:bold; margin-left:4px;">⭐ ${rating} (${reviewCount})</span>`;
                        
                        const infowindowContent = `
                            <div style="padding:10px; font-size:12px; width:230px; line-height:1.4;">
                                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
                                    <a href="${mapUrl}" target="_blank" style="font-weight:bold; font-size:14px; color:#0066ff; text-decoration:none;">
                                        ${name} ${ratingBadgeHtml} 🔗
                                    </a>
                                </div>
                                <div><strong>업종:</strong> ${category}</div>
                                <div><strong>주소:</strong> ${address}</div>
                                <div><strong>전화:</strong> ${tel}</div>
                                <div><strong>거리:</strong> 중심지에서 약 ${distanceMeters}m</div>
                                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:6px;">
                                    <span style="color:#16a34a; font-weight:bold;">🟢 영업중</span>
                                    <button onclick="window.toggleWishFromWindow('${getStoreKey(store)}')" style="background:#f1f5f9; border:1px solid #cbd5e1; border-radius:4px; padding:2px 6px; cursor:pointer; font-size:11px;">${wishIcon} 찜하기</button>
                                </div>
                            </div>
                        `;

                        const infowindow = new kakao.maps.InfoWindow({
                            content: infowindowContent,
                            removable: true
                        });

                        kakao.maps.event.addListener(marker, 'mouseover', function() {
                            if (pinnedInfoWindow !== infowindow) infowindow.open(map, marker);
                        });

                        kakao.maps.event.addListener(marker, 'mouseout', function() {
                            if (pinnedInfoWindow !== infowindow) infowindow.close();
                        });

                        kakao.maps.event.addListener(marker, 'click', function() {
                            pinStoreOnMap(store, marker, infowindow);
                        });

                        currentMarkers.push({ marker, infowindow, store });
                    }
                });

                let totalCount = 0;
                for (const [groupName, storeList] of Object.entries(groups)) {
                    totalCount += storeList.length;
                    const section = document.createElement('div');
                    section.className = 'group-section';

                    const titleDiv = document.createElement('div');
                    titleDiv.className = 'group-title';
                    titleDiv.innerHTML = `
                        <span>🍴 ${groupName}</span>
                        <div class="group-count-wrap">
                            <span class="group-count">${storeList.length}개</span>
                            <span class="toggle-icon" style="transform: ${isAllCollapsed ? 'rotate(-90deg)' : 'rotate(0deg)'};">▼</span>
                        </div>
                    `;

                    const contentDiv = document.createElement('div');
                    contentDiv.className = 'group-content' + (isAllCollapsed ? ' collapsed' : '');

                    titleDiv.onclick = function(e) {
                        e.stopPropagation();
                        const isCollapsed = contentDiv.classList.toggle('collapsed');
                        const icon = titleDiv.querySelector('.toggle-icon');
                        icon.style.transform = isCollapsed ? 'rotate(-90deg)' : 'rotate(0deg)';
                    };

                    section.appendChild(titleDiv);
                    section.appendChild(contentDiv);

                    storeList.sort((a, b) => {
                        if (b.rating !== a.rating) return b.rating - a.rating;
                        if (b.reviewCount !== a.reviewCount) return b.reviewCount - a.reviewCount;
                        return a.distanceMeters - b.distanceMeters;
                    });

                    storeList.forEach((store) => {
                        const name = store.bizesNm || '상호명 없음';
                        const category = store.indsSclsNm || '업종 정보 없음';
                        const address = store.rdnmAdr || store.lnoAdr || '주소 정보 없음';
                        const tel = (store.telno && store.telno.trim() !== '') ? store.telno : generateMockTel(store.bizesId, address);
                        const mapUrl = getMapSearchUrl(selectedPlatform, name, address);
                        const ratingBadgeHtml = `<span class="rating-badge">⭐ ${store.rating} (${store.reviewCount})</span>`;
                        const isW = isWished(store);

                        const card = document.createElement('div');
                        card.className = 'store-card';
                        store._cardElement = card; 

                        card.innerHTML = `
                            <div class="store-name">
                                <span>${name} ${ratingBadgeHtml}</span>
                                <div style="display:flex; align-items:center; gap:6px;">
                                    <button class="wish-btn" title="찜하기">${isW ? '❤️' : '🤍'}</button>
                                    <a href="${mapUrl}" target="_blank" onclick="event.stopPropagation();" style="font-size:11px; color:#0066ff; text-decoration:none; font-weight:normal;">[상세보기 ↗]</a>
                                </div>
                            </div>
                            <div class="store-info">📍 ${address}</div>
                            <div class="store-info">☎️ ${tel} | 📏 ${store.distanceMeters}m</div>
                            <div class="store-info" style="color: #16a34a; font-weight: bold;">🟢 영업중 (매일 10:00 - 22:00)</div>
                            <div class="store-category">🏷️ ${category}</div>
                        `;

                        const wishBtn = card.querySelector('.wish-btn');
                        wishBtn.onclick = function(e) {
                            toggleWish(store, e);
                        };

                        card.onmouseenter = function() {
                            const found = currentMarkers.find(m => m.store === store);
                            if (found && pinnedInfoWindow !== found.infowindow) found.infowindow.open(map, found.marker);
                        };

                        card.onmouseleave = function() {
                            const found = currentMarkers.find(m => m.store === store);
                            if (found && pinnedInfoWindow !== found.infowindow) found.infowindow.close();
                        };

                        card.onclick = function(e) {
                            e.stopPropagation();
                            const found = currentMarkers.find(m => m.store === store);
                            if (found) pinStoreOnMap(store, found.marker, found.infowindow);
                        };

                        contentDiv.appendChild(card);
                    });

                    listContainer.appendChild(section);
                }

                if (totalCount === 0) {
                    listContainer.innerHTML = '<p style="text-align: center; color: #888; margin-top: 30px;">반경 내 음식점이 없습니다.</p>';
                }
            }

            window.toggleWishFromWindow = function(storeKey) {
                const foundStore = currentStores.find(s => getStoreKey(s) === storeKey);
                if (foundStore) {
                    toggleWish(foundStore);
                } else {
                    const index = wishlist.indexOf(storeKey);
                    if (index > -1) wishlist.splice(index, 1);
                    else wishlist.push(storeKey);
                    localStorage.setItem('my_store_wishlist', JSON.stringify(wishlist));
                    updateWishlistButtonCount();
                    renderWishlist();
                }
            };

            function renderWishlist() {
                const listContainer = document.getElementById('store-list-container');
                listContainer.innerHTML = '';
                clearMarkers();
                updateGuideText(radius, null);

                if (wishlist.length === 0) {
                    listContainer.innerHTML = '<p style="text-align: center; color: #888; margin-top: 50px;">찜한 음식점이 없습니다. 마음에 드는 식당에 하트를 눌러보세요!</p>';
                    return;
                }

                const wishedStores = [];
                wishlist.forEach(key => {
                    let matched = currentStores.find(s => getStoreKey(s) === key);
                    if (!matched) {
                        matched = {
                            bizesId: key,
                            bizesNm: key.split('_')[0] || '찜한 음식점',
                            rdnmAdr: key.split('_')[1] || '주소 정보 없음',
                            lat: centerLat,
                            lon: centerLng,
                            distanceMeters: 0
                        };
                    }
                    wishedStores.push(matched);
                });

                const selectedPlatform = document.getElementById('map-platform-select').value;
                const contentDiv = document.createElement('div');
                contentDiv.className = 'group-content';

                wishedStores.forEach((store) => {
                    const name = store.bizesNm || '상호명 없음';
                    const address = store.rdnmAdr || store.lnoAdr || '주소 정보 없음';
                    const tel = (store.telno && store.telno.trim() !== '') ? store.telno : generateMockTel(store.bizesId, address);
                    const category = store.indsSclsNm || '즐겨찾기 맛집';
                    const mapUrl = getMapSearchUrl(selectedPlatform, name, address);
                    const { rating, reviewCount } = getStoreRatingAndReviews(store);
                    const ratingBadgeHtml = `<span class="rating-badge">⭐ ${rating} (${reviewCount})</span>`;

                    if (store.lat && store.lon) {
                        const markerPosition = new kakao.maps.LatLng(store.lat, store.lon);
                        const marker = new kakao.maps.Marker({ position: markerPosition });
                        marker.setMap(map);

                        const infowindow = new kakao.maps.InfoWindow({
                            content: `<div style="padding:10px; font-size:12px; width:220px;"><strong>${name}</strong><br>주소: ${address}<br><a href="${mapUrl}" target="_blank" style="color:#0066ff;">상세보기 ↗</a></div>`,
                            removable: true
                        });

                        kakao.maps.event.addListener(marker, 'click', function() {
                            pinStoreOnMap(store, marker, infowindow);
                        });

                        currentMarkers.push({ marker, infowindow, store });
                    }

                    const card = document.createElement('div');
                    card.className = 'store-card';
                    store._cardElement = card;

                    card.innerHTML = `
                        <div class="store-name">
                            <span>${name} ${ratingBadgeHtml}</span>
                            <div style="display:flex; align-items:center; gap:6px;">
                                <button class="wish-btn" title="찜 해제">❤️</button>
                                <a href="${mapUrl}" target="_blank" onclick="event.stopPropagation();" style="font-size:11px; color:#0066ff; text-decoration:none; font-weight:normal;">[상세보기 ↗]</a>
                            </div>
                        </div>
                        <div class="store-info">📍 ${address}</div>
                        <div class="store-info">☎️ ${tel}</div>
                        <div class="store-category">🏷️ ${category}</div>
                    `;

                    const wishBtn = card.querySelector('.wish-btn');
                    wishBtn.onclick = function(e) {
                        toggleWish(store, e);
                    };

                    card.onclick = function(e) {
                        e.stopPropagation();
                        const found = currentMarkers.find(m => m.store === store);
                        if (found) pinStoreOnMap(store, found.marker, found.infowindow);
                    };

                    contentDiv.appendChild(card);
                });

                const section = document.createElement('div');
                section.className = 'group-section';
                section.innerHTML = `<div class="group-title" style="cursor:default;"><span>❤️ 찜한 맛집 모음</span><span class="group-count">${wishedStores.length}개</span></div>`;
                section.appendChild(contentDiv);
                listContainer.appendChild(section);
            }

            // 속도 개선을 위한 디바운스(Debounce) 적용 함수
            let loadTimer = null;
            function loadStoresDebounced(lat, lng) {
                if (isWishlistMode) return;
                if (loadTimer) clearTimeout(loadTimer);
                
                document.getElementById('store-list-container').innerHTML = '<p style="text-align: center; color: #888; margin-top: 30px;">데이터를 불러오는 중...</p>';
                
                loadTimer = setTimeout(async () => {
                    try {
                        const response = await fetch(`/api/stores/radius?cx=${lng}&cy=${lat}&radius=${radius}&numOfRows=500`);
                        const data = await response.json();

                        let items = [];
                        if (data?.body?.items) items = data.body.items;
                        else if (data?.response?.body?.items?.item) items = data.response.body.items.item;
                        else if (Array.isArray(data)) items = data;

                        if (!Array.isArray(items)) items = items ? [items] : [];

                        currentStores = items.filter(store => getFoodCategory(store.indsSclsNm, store.indsLclsNm, store.bizesNm) !== null);

                        document.getElementById('search-keyword').value = '';
                        renderStores(currentStores, new kakao.maps.LatLng(lat, lng));

                    } catch (error) {
                        console.error('데이터 로드 실패:', error);
                        document.getElementById('store-list-container').innerHTML = '<p style="color:red; text-align:center;">데이터를 불러오지 못했습니다.</p>';
                    }
                }, 300); // 0.3초 지연을 주어 연속 이벤트 발생 시 렌더링 부하 및 지연 방지
            }

            function filterStores() {
                if (isWishlistMode) return;
                const rawKeyword = document.getElementById('search-keyword').value;
                const keyword = rawKeyword.replace(/\s+/g, '').toLowerCase();

                if (!keyword) {
                    renderStores(currentStores, new kakao.maps.LatLng(centerLat, centerLng));
                    return;
                }

                const filtered = currentStores.filter(store => {
                    const name = (store.bizesNm || '').replace(/\s+/g, '').toLowerCase();
                    const category = (store.indsSclsNm || '').replace(/\s+/g, '').toLowerCase();
                    
                    let altKeyword = keyword;
                    if (keyword === '엘에이') altKeyword = 'la';
                    else if (keyword === 'la') altKeyword = '엘에이';

                    return name.includes(keyword) || name.includes(altKeyword) || category.includes(keyword);
                });

                renderStores(filtered, new kakao.maps.LatLng(centerLat, centerLng));
            }

            document.getElementById('search-btn').onclick = filterStores;
            document.getElementById('search-keyword').onkeyup = function(event) {
                (event.key === 'Enter') && filterStores();
            };

            document.getElementById('map-platform-select').onchange = function() {
                if (isWishlistMode) renderWishlist();
                else filterStores();
            };

            function updateCenterMarker(latlng) {
                if (centerMarker) centerMarker.setMap(null);
                if (centerCircle) centerCircle.setMap(null);
                if (centerInfoWindow) centerInfoWindow.close();

                const imageSrc = 'https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/marker_red.png';
                const imageSize = new kakao.maps.Size(40, 42);
                const imageOption = { offset: new kakao.maps.Point(13, 37) };
                const markerImage = new kakao.maps.MarkerImage(imageSrc, imageSize, imageOption);

                centerMarker = new kakao.maps.Marker({
                    position: latlng,
                    image: markerImage
                });
                centerMarker.setMap(map);

                centerCircle = new kakao.maps.Circle({
                    center: latlng,
                    radius: radius,
                    strokeWeight: 2,
                    strokeColor: '#ff4d4d',
                    strokeOpacity: 0.8,
                    fillColor: '#ff4d4d',
                    fillOpacity: 0.2
                });
                centerCircle.setMap(map);

                updateGuideText(radius, null);

                searchDetailAddrFromCoords(latlng, function(result, status) {
                    if (status === kakao.maps.services.Status.OK) {
                        let detailAddr = result[0].road_address ? result[0].road_address.address_name : '';
                        let jibunAddr = result[0].address ? result[0].address.address_name : '';
                        let fullAddress = detailAddr || jibunAddr || '주소 정보 없음';

                        updateGuideText(radius, fullAddress);

                        centerInfoWindow = new kakao.maps.InfoWindow({
                            content: `<div style="padding:8px 12px; font-size:12px; font-weight:bold; color:#d32f2f;">📍 선택된 중심 위치<br><span style="font-weight:normal; color:#333;">${fullAddress}</span></div>`,
                            removable: true
                        });

                        kakao.maps.event.addListener(centerMarker, 'click', function() {
                            centerInfoWindow.open(map, centerMarker);
                        });
                    }
                });
            }

            document.getElementById('current-location-btn').onclick = function(e) {
                e.stopPropagation();
                if (!navigator.geolocation) {
                    alert('이 브라우저는 위치 정보를 지원하지 않습니다.');
                    return;
                }

                if (isWishlistMode) {
                    isWishlistMode = false;
                    updateWishlistButtonCount();
                }

                document.getElementById('store-list-container').innerHTML = '<p style="text-align: center; color: #888; margin-top: 50px;">현재 위치를 가져오는 중...</p>';

                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        centerLat = position.coords.latitude;
                        centerLng = position.coords.longitude;

                        const currentLatLng = new kakao.maps.LatLng(centerLat, centerLng);
                        map.setCenter(currentLatLng);
                        updateCenterMarker(currentLatLng);
                        loadStoresDebounced(centerLat, centerLng);
                    },
                    function(error) {
                        alert('현재 위치를 가져오지 못했습니다. 위치 권한을 확인해주세요.');
                        console.warn(error);
                    },
                    { timeout: 10000, maximumAge: 0 }
                );
            };

            kakao.maps.event.addListener(map, 'zoom_changed', function() {
                const newLevel = map.getLevel();
                if (newLevel !== currentLevel) {
                    currentLevel = newLevel;
                    radius = getRadiusByLevel(currentLevel);
                    
                    const fixedLatLng = new kakao.maps.LatLng(centerLat, centerLng);
                    updateCenterMarker(fixedLatLng);
                    loadStoresDebounced(centerLat, centerLng);
                }
            });

            kakao.maps.event.addListener(map, 'click', function(mouseEvent) {
                if (window.innerWidth <= 768) {
                    setSidebarHeight(heights.peek);
                }

                if (pinnedInfoWindow) {
                    pinnedInfoWindow.close();
                    pinnedInfoWindow = null;
                }
                document.querySelectorAll('.store-card').forEach(c => c.classList.remove('selected'));

                const latlng = mouseEvent.latLng;
                centerLat = latlng.getLat();
                centerLng = latlng.getLng();

                if (isWishlistMode) {
                    isWishlistMode = false;
                    updateWishlistButtonCount();
                }

                updateCenterMarker(latlng);
                loadStoresDebounced(centerLat, centerLng);
            });

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        centerLat = position.coords.latitude;
                        centerLng = position.coords.longitude;

                        const currentLatLng = new kakao.maps.LatLng(centerLat, centerLng);
                        map.setCenter(currentLatLng);
                        updateCenterMarker(currentLatLng);
                        loadStoresDebounced(centerLat, centerLng);
                    },
                    function(error) {
                        console.warn('현재 위치를 가져올 수 없어 기본 위치(서울시청)로 대체합니다.', error);
                        const defaultLatLng = new kakao.maps.LatLng(centerLat, centerLng);
                        updateCenterMarker(defaultLatLng);
                        loadStoresDebounced(centerLat, centerLng);
                    },
                    { timeout: 10000, maximumAge: 0 }
                );
            } else {
                const defaultLatLng = new kakao.maps.LatLng(centerLat, centerLng);
                updateCenterMarker(defaultLatLng);
                loadStoresDebounced(centerLat, centerLng);
            }
        };
    </script>
</body>
</html>
